<style>
  :root {
    --sidebar-bg: #14231b;
    --sidebar-bg-2: #182a20;
    --active-green: #2f7d52;
    --accent-gold: #c9973f;
    --accent-purple: #6b4a63;
    --text-light: #cdd6d0;
    --text-muted: #7d8c84;
    --card-bg: #ffffff;
    --page-bg: #f2f3f1;
    --border-light: #e5e7e5;
    --heading: #1c2a22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; display: flex; min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--page-bg); color: var(--heading);
  }

  /* ---------- SIDEBAR ---------- */
  .app-sidebar {
    width: 250px; min-width: 250px; background: var(--sidebar-bg);
    color: var(--text-light); display: flex; flex-direction: column; padding: 18px 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 18px 20px 18px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent-gold);
    display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent-gold); font-size: 12px;
  }
  .brand .title { font-weight: bold; color: #fff; font-size: 15px; line-height: 1.2; }
  .brand .subtitle { font-size: 11px; color: var(--text-muted); }

  .nav-group-label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); padding: 14px 18px 4px 18px; letter-spacing: .05em; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: var(--text-light);
    text-decoration: none; font-size: 13px; cursor: pointer; border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.05); }
  .nav-item.active { background: var(--active-green); color: #fff; border-left-color: var(--accent-gold); font-weight: 600; }
  .nav-item .icon { width: 18px; text-align: center; }

  /* ---------- MAIN CONTENT ---------- */
  .app-main { flex: 1; padding: 26px 30px; overflow-y: auto; }
  .page-title { font-size: 22px; font-weight: 800; margin: 0 0 4px 0; color: var(--heading); }
  .page-subtitle { font-size: 13px; color: #667; margin: 0 0 18px 0; }

  .tab-bar { display: flex; gap: 6px; border-bottom: 1px solid var(--border-light); margin-bottom: 18px; }
  .tab-bar a, .tab-bar span {
    padding: 10px 14px; font-size: 13px; font-weight: 600; color: #667; text-decoration: none;
    border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px;
  }
  .tab-bar a.active { color: var(--active-green); border-bottom-color: var(--active-green); }

  .card {
    background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 10px;
    padding: 20px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card h3 { margin: 0 0 14px 0; font-size: 15px; }

  .field-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 160px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: #445; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border-light); border-radius: 6px; font-size: 13px;
  }

  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border: none; border-radius: 7px;
    font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-green { background: var(--active-green); color: #fff; }
  .btn-gold { background: var(--accent-gold); color: #fff; }
  .btn-purple { background: var(--accent-purple); color: #fff; }
  .btn-outline { background: #f5f2ea; color: #7a6a4a; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }

  .kpi-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .kpi-card {
    flex: 1; min-width: 200px; background: var(--card-bg); border: 1px solid var(--border-light);
    border-radius: 10px; padding: 18px 20px;
  }
  .kpi-card .label { font-size: 11px; font-weight: 700; color: #889; letter-spacing: .03em; }
  .kpi-card .value { font-size: 26px; font-weight: 800; margin-top: 6px; color: var(--heading); }

  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; }
  .msg.ok { background: #eafaf1; color: #196f3d; border-left: 4px solid var(--active-green); }
  .msg.err { background: #fdecea; color: #c0392b; border-left: 4px solid #e74c3c; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.data-table th { background: var(--sidebar-bg); color: #fff; padding: 8px; text-align: left; }
  table.data-table td { border-bottom: 1px solid var(--border-light); padding: 8px; }

  @media (max-width: 800px) {
    body { flex-direction: column; }
    .app-sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 10px; }
    .brand { display: none; }
    .nav-group-label { display: none; }
    .nav-item { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .nav-item.active { border-left: none; border-bottom-color: var(--accent-gold); }
  }

  /* ================= THIẾT KẾ GIAO DIỆN TAB / WIZARD ================= */
.wizard-header {
  display: flex;
  gap: 15px;
  margin-bottom: 20px;
  border-bottom: 2px solid #e2e8f0;
  padding-bottom: 10px;
}
.wizard-step {
  padding: 10px 25px;
  background-color: #f1f5f9;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  color: #64748b;
  transition: all 0.3s ease;
}
.wizard-step:hover {
  background-color: #e2e8f0;
}
.wizard-step.active {
  background-color: #0d6efd; /* Bạn có thể đổi mã màu cho hợp với theme của bạn */
  color: white;
  box-shadow: 0 4px 6px rgba(13, 110, 253, 0.2);
}
</style>
