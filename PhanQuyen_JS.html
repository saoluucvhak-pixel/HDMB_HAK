-->

<script>
var HAK_PHIEN_KHOA = 'hak_hdmb_phien';
var HAK_LOI_DANG_NHAP = '[AUTH] ';
var HAK_LOI_QUYEN = '[QUYEN] ';
var HAK_PHIEN = '';
var HAK_NGUOI_DUNG = null;
// Quyền tối thiểu để mở từng trang (?page=...) — khớp QUYEN ở 34_PhanQuyen.gs. Máy chủ vẫn tự kiểm tra từng chức năng.
var HAK_QUYEN_TRANG = { tongquan: 'XEM', tracuu: 'XEM', hinhanh: 'XEM', map: 'XEM', baocao: 'XEM', kiemtra: 'XEM', huongdan: 'XEM',
  form: 'NHAP_LIEU', hopdongmc: 'NHAP_LIEU', meconn: 'NHAP_LIEU', thietlap: 'QUAN_TRI' };

// Mã phiên lưu ở localStorage -> dùng chung cho MỌI tab của trình duyệt (trước đây sessionStorage:
// mở tab mới / đóng trình duyệt là phải đăng nhập lại qua Google). Máy chủ tự gia hạn khi đang dùng
// (thongTinDangNhap trả phienMoi) và bắt đăng nhập lại sau 7 ngày; Đăng xuất xóa ở mọi tab.
function hakLuuPhien_(phien) {
  HAK_PHIEN = phien || '';
  try { if (HAK_PHIEN) localStorage.setItem(HAK_PHIEN_KHOA, HAK_PHIEN); else localStorage.removeItem(HAK_PHIEN_KHOA); } catch (e) { /* trình duyệt chặn lưu trữ */ }
  try { if (HAK_PHIEN) sessionStorage.setItem(HAK_PHIEN_KHOA, HAK_PHIEN); else sessionStorage.removeItem(HAK_PHIEN_KHOA); } catch (e) { /* bỏ qua */ }
}
/** Mã phiên mới nhất (tab khác có thể vừa gia hạn). */
function hakPhien_() {
  // localStorage dùng được -> đó là nguồn duy nhất (tab khác đăng xuất/gia hạn là thấy ngay);
  // chỉ khi trình duyệt chặn localStorage mới dùng sessionStorage / biến trong trang.
  try { return localStorage.getItem(HAK_PHIEN_KHOA) || ''; } catch (e) { /* bị chặn */ }
  try { return sessionStorage.getItem(HAK_PHIEN_KHOA) || HAK_PHIEN; } catch (e) { return HAK_PHIEN; }
}
/** Trình duyệt có cho trang lưu dữ liệu không (bị chặn khi tắt "cookie bên thứ ba"). */
var HAK_CO_LUU_TRU = (function () {
  try { localStorage.setItem('hak_thu', '1'); localStorage.removeItem('hak_thu'); return true; } catch (e) { return false; }
})();
(function hakKhoiTaoPhien_() {
  var el = document.getElementById('hakPhanQuyen');
  var tuServer = el ? (el.getAttribute('data-phien') || '') : '';
  if (tuServer) {
    hakLuuPhien_(tuServer);
    // Bỏ ?sso=... / ?ph=... khỏi địa chỉ (link đăng nhập chỉ dùng được 1 lần; mã phiên không nên nằm trong lịch sử duyệt web).
    try {
      google.script.url.getLocation(function (loc) {
        var ts = {}, p = (loc && loc.parameter) || {};
        Object.keys(p).forEach(function (k) { if (k !== 'sso' && k !== 'ph') ts[k] = p[k]; });
        if (!ts.page && hakTrangHienTai_()) ts.page = hakTrangHienTai_();
        google.script.history.replace(null, ts);
      });
    } catch (e) { /* không có google.script.url / history */ }
  } else {
    HAK_PHIEN = hakPhien_();
  }
})();
/** Không lưu được phiên trong trình duyệt -> gắn mã phiên vào link chuyển trang của hệ thống. */
function hakGanPhienVaoLink_(url) {
  var goc = (document.getElementById('hakPhanQuyen') || { getAttribute: function () { return ''; } }).getAttribute('data-base') || '';
  var p = hakPhien_();
  if (HAK_CO_LUU_TRU || !p || !goc || String(url).indexOf(goc) !== 0 || /[?&]ph=/.test(url)) return url;
  return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'ph=' + encodeURIComponent(p);
}
if (!HAK_CO_LUU_TRU) {
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href]') : null;
    if (a && !a.hasAttribute('data-drive-goc')) a.setAttribute('href', hakGanPhienVaoLink_(a.getAttribute('href')));
  }, true);
  var hakMoGoc_ = window.open;
  window.open = function (url) { var ts = Array.prototype.slice.call(arguments); ts[0] = hakGanPhienVaoLink_(String(url || '')); return hakMoGoc_.apply(window, ts); };
}

function hakTrangHienTai_() {
  var el = document.getElementById('hakPhanQuyen');
  return el ? (el.getAttribute('data-trang') || '') : '';
}
function hakCoQuyen_(quyen) {
  return !!(HAK_NGUOI_DUNG && HAK_NGUOI_DUNG.quyen && HAK_NGUOI_DUNG.quyen.indexOf(quyen) !== -1);
}
function hakPhanSauTienTo_(msg, tienTo) {
  var i = msg.indexOf(tienTo);
  return i >= 0 ? msg.slice(i + tienTo.length) : '';
}

/**
 * A1 (rà soát 28/09): CHỐNG BẤM LẶP cho mọi nút gọi hàm GHI dữ liệu — trước đây chỉ nút Lưu hợp đồng có chặn; Duyệt/Từ chối
 * ảnh, Thêm GPS, Thêm/Xóa tài khoản, Duyệt hàng loạt, Xuất file bấm 2 lần là gửi 2 lệnh. Nút vừa bấm (trong 1 giây trước
 * lời gọi) bị khóa + mờ tới khi máy chủ trả kết quả (thành công hay lỗi), rồi mở lại TRƯỚC khi chạy xử lý của trang (trang
 * vẫn tự khóa tiếp được nếu muốn). Chỉ áp dụng cho hàm ghi — lời gọi đọc dữ liệu không bị ảnh hưởng.
 */
var HAK_HAM_GHI_ = /^(THEM_|CAP_NHAT_|XOA_|DUYET_|TU_CHOI_|GAN_|LUU_|TAO_|HUY_|THANH_LY|KHOI_PHUC_|TAI_|XUAT_|DONG_BO|DOC_TOA_DO|TRICH_XUAT|OCR_|KIEM_TRA_ANH_DA_CHON|KIEM_TRA_ANH_TU_LINK|KIEM_TRA_HO_SO_TOAN_BO|DOI_CHIEU|themLoaiHoSoMoi|doiChieuMotLoRung)/;
var hakNutVuaBam_ = null, hakLucBam_ = 0;
document.addEventListener('click', function (e) {
  var n = e.target && e.target.closest ? e.target.closest('button, a.btn, a.lnk-sua, a.lnk-huy, input[type=button], input[type=submit]') : null;
  if (!n) return;
  if (n.getAttribute('data-hak-dang-chay')) { e.stopImmediatePropagation(); e.preventDefault(); return; } // đang chạy -> bỏ cú bấm
  hakNutVuaBam_ = n; hakLucBam_ = Date.now();
}, true);
function hakKhoaNutVuaBam_(tenHam) {
  if (!HAK_HAM_GHI_.test(tenHam) || !hakNutVuaBam_ || Date.now() - hakLucBam_ > 1000) return null;
  var n = hakNutVuaBam_;
  hakNutVuaBam_ = null; // 1 cú bấm chỉ khóa cho lời gọi ĐẦU TIÊN nó gây ra
  if (n.getAttribute('data-hak-dang-chay')) return null;
  var daTatTruoc = !!n.disabled;
  n.setAttribute('data-hak-dang-chay', '1');
  n.setAttribute('aria-busy', 'true');
  if ('disabled' in n) n.disabled = true;
  n.style.pointerEvents = 'none';
  n.style.opacity = '0.6';
  return function () {
    n.removeAttribute('data-hak-dang-chay');
    n.removeAttribute('aria-busy');
    if ('disabled' in n && !daTatTruoc) n.disabled = false;
    n.style.pointerEvents = '';
    n.style.opacity = '';
  };
}

/** Thay cho google.script.run: cùng cách dùng, nhưng mọi lời gọi đi qua api(phien, tên, [tham số]). */
function hakRun_() {
  var runner = google.script.run, coXuLyLoi = false, fThanhCong = null, fLoi = null, moKhoa = null;
  var xong = function () { if (moKhoa) { var m = moKhoa; moKhoa = null; try { m(); } catch (e) { /* phần tử đã bị vẽ lại */ } } };
  var boc = function (f) {
    return function (err, userObj) {
      xong();
      var msg = String((err && err.message) || err || '');
      var loiDangNhap = hakPhanSauTienTo_(msg, HAK_LOI_DANG_NHAP);
      if (loiDangNhap) { hakHienDangNhap_(loiDangNhap); return; }
      var loiQuyen = hakPhanSauTienTo_(msg, HAK_LOI_QUYEN);
      if (f) f(loiQuyen ? new Error(loiQuyen) : err, userObj);
      else if (loiQuyen && typeof thongBao_ === 'function') thongBao_(loiQuyen, 'loi');
      else console.error(msg);
    };
  };
  var p = new Proxy({}, { get: function (_, ten) {
    if (ten === 'withSuccessHandler') return function (f) { fThanhCong = f; return p; };
    if (ten === 'withFailureHandler') return function (f) { coXuLyLoi = true; fLoi = f; return p; };
    if (ten === 'withUserObject') return function (o) { runner = runner.withUserObject(o); return p; };
    return function () {
      var thamSo = Array.prototype.slice.call(arguments);
      moKhoa = hakKhoaNutVuaBam_(String(ten));
      runner = runner
        .withSuccessHandler(function (kq, userObj) { xong(); if (fThanhCong) fThanhCong(kq, userObj); })
        .withFailureHandler(boc(coXuLyLoi ? fLoi : null));
      return runner.api(hakPhien_(), String(ten), thamSo);
    };
  } });
  return p;
}

/**
 * A3 (rà soát 28/09): HỘP THOẠI XÁC NHẬN / NHẬP LIỆU dùng chung thay cho confirm()/prompt() của trình duyệt — hộp mặc định
 * bị chặn trong khung nhúng trên một số trình duyệt điện thoại (trả về false/null ngay, thao tác bị bỏ qua không báo), không
 * xuống dòng/định dạng được và che mật khẩu không được. Trả Promise:
 *   hakXacNhan_(noiDung, { tieuDe, nutDongY, nguyHiem }) -> true/false
 *   hakNhapChu_(noiDung, { tieuDe, matKhau, giaTri })   -> chuỗi đã nhập hoặc null (bấm Hủy)
 * Enter = đồng ý, Esc / bấm nền = hủy; trả focus về chỗ cũ khi đóng.
 */
function hakHopThoai_(noiDung, tuyChon, coONhap) {
  tuyChon = tuyChon || {};
  return new Promise(function (xong) {
    var truocDo = document.activeElement;
    var nen = document.createElement('div');
    nen.setAttribute('role', 'dialog'); nen.setAttribute('aria-modal', 'true');
    nen.style.cssText = 'position:fixed;inset:0;z-index:100002;background:rgba(17,24,39,.55);display:flex;align-items:center;justify-content:center;padding:16px;font:14px -apple-system,"Segoe UI",Roboto,Arial,sans-serif';
    var hop = document.createElement('div');
    hop.style.cssText = 'background:var(--card-bg, #fff);color:var(--chu-chinh, #1f2937);border-radius:12px;max-width:460px;width:100%;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:20px 20px 16px';
    var td = document.createElement('div');
    td.id = 'hakHopThoaiTieuDe_' + Date.now();
    td.style.cssText = 'font-weight:700;font-size:16px;margin-bottom:8px';
    td.textContent = tuyChon.tieuDe || (coONhap ? 'Nhập thông tin' : (tuyChon.nguyHiem ? '⚠️ Xác nhận' : 'Xác nhận'));
    nen.setAttribute('aria-labelledby', td.id);
    var nd = document.createElement('div');
    nd.style.cssText = 'white-space:pre-wrap;line-height:1.5;max-height:50vh;overflow:auto;margin-bottom:14px';
    nd.textContent = String(noiDung == null ? '' : noiDung);
    hop.appendChild(td); hop.appendChild(nd);
    var o = null;
    if (coONhap) {
      o = document.createElement('input');
      o.type = tuyChon.matKhau ? 'password' : 'text';
      o.value = tuyChon.giaTri || '';
      o.setAttribute('aria-label', td.textContent);
      o.style.cssText = 'width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--vien, #d1d5db);border-radius:8px;font-size:14px;margin-bottom:14px';
      hop.appendChild(o);
    }
    var hang = document.createElement('div');
    hang.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap';
    var nutHuy = document.createElement('button');
    nutHuy.type = 'button'; nutHuy.textContent = tuyChon.nutHuy || 'Hủy';
    nutHuy.style.cssText = 'padding:9px 16px;border-radius:8px;border:1px solid var(--vien, #d1d5db);background:var(--card-bg, #fff);color:var(--chu-chinh, #1f2937);cursor:pointer;font-weight:600;min-height:40px';
    var nutOk = document.createElement('button');
    nutOk.type = 'button'; nutOk.textContent = tuyChon.nutDongY || 'Đồng ý';
    nutOk.style.cssText = 'padding:9px 16px;border-radius:8px;border:0;color:#fff;cursor:pointer;font-weight:600;min-height:40px;background:' + (tuyChon.nguyHiem ? '#dc2626' : '#16a34a');
    if (tuyChon.chiDongY) nutHuy.style.display = 'none'; // hộp thông báo: chỉ nút "Đã hiểu"
    hang.appendChild(nutHuy); hang.appendChild(nutOk); hop.appendChild(hang);
    nen.appendChild(hop); document.body.appendChild(nen);
    var dong = function (kq) {
      document.removeEventListener('keydown', phim, true);
      if (nen.parentNode) nen.parentNode.removeChild(nen);
      try { if (truocDo && truocDo.focus) truocDo.focus(); } catch (e) { /* bỏ qua */ }
      xong(kq);
    };
    var dongY = function () { dong(coONhap ? o.value : true); };
    var huy = function () { dong(coONhap ? null : false); };
    var phim = function (e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); huy(); }
      else if (e.key === 'Enter' && (coONhap || document.activeElement !== nutHuy)) { e.preventDefault(); e.stopPropagation(); dongY(); }
      else if (e.key === 'Tab') { // giữ focus trong hộp thoại
        var ds = [o, nutHuy, nutOk].filter(Boolean), i = ds.indexOf(document.activeElement);
        e.preventDefault(); ds[(i + (e.shiftKey ? ds.length - 1 : 1)) % ds.length].focus();
      }
    };
    document.addEventListener('keydown', phim, true);
    nutHuy.addEventListener('click', huy); nutOk.addEventListener('click', dongY);
    nen.addEventListener('click', function (e) { if (e.target === nen) huy(); });
    (o || (tuyChon.nguyHiem ? nutHuy : nutOk)).focus();
  });
}
/**
 * A4 (rà soát 28/09): NHỚ BỘ LỌC theo từng trang trên máy người dùng (localStorage) — mở lại trang không phải gõ lại. Chỉ lưu
 * giá trị các ô lọc được liệt kê; không lưu dữ liệu hợp đồng. Đăng xuất thì xóa. Trình duyệt chặn bộ nhớ -> bỏ qua êm.
 * Gọi ở đầu khối khởi tạo trang, TRƯỚC lần tải dữ liệu đầu tiên.
 */
var HAK_TIEN_TO_BO_LOC_ = 'hak_hdmb_loc_';
function hakNhoBoLoc_(khoaTrang, dsId) {
  var khoa = HAK_TIEN_TO_BO_LOC_ + khoaTrang, daLuu = {};
  try { daLuu = JSON.parse(localStorage.getItem(khoa) || '{}') || {}; } catch (e) { daLuu = {}; }
  var luu = function () {
    var o = {};
    dsId.forEach(function (id) { var el = document.getElementById(id); if (el && el.value) o[id] = el.value; });
    try { localStorage.setItem(khoa, JSON.stringify(o)); } catch (e) { /* bị chặn -> thôi */ }
  };
  dsId.forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    if (Object.prototype.hasOwnProperty.call(daLuu, id)) el.value = daLuu[id];
    el.addEventListener('change', luu);
    el.addEventListener('input', luu);
  });
}
function hakXoaBoLocDaNho_() {
  try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(HAK_TIEN_TO_BO_LOC_) === 0) localStorage.removeItem(k); }); } catch (e) { /* bỏ qua */ }
}

function hakXacNhan_(noiDung, tuyChon) { return hakHopThoai_(noiDung, tuyChon, false); }
function hakNhapChu_(noiDung, tuyChon) { return hakHopThoai_(noiDung, tuyChon, true); }

function hakDangNhung_() {
  try { return window.parent !== window.top; } catch (e) { return true; }
}

function hakHienDangNhap_(loi, tieuDe) {
  var nen = document.getElementById('hakDangNhapNen');
  if (!nen) return;
  if (!tieuDe) {
    hakLuuPhien_('');
  }
  document.getElementById('hakDangNhapTieuDe').textContent = tieuDe || '🔐 Đăng nhập';
  var elLoi = document.getElementById('hakDangNhapLoi');
  elLoi.textContent = loi || '';
  elLoi.style.display = loi ? '' : 'none';
  var vung = document.getElementById('hakDangNhapNut');
  vung.textContent = '';
  var trang = hakTrangHienTai_();
  var cong = (HAK_NGUOI_DUNG && HAK_NGUOI_DUNG.congDangNhapUrl) || '';
  var phu = document.getElementById('hakDangNhapPhu');
  phu.textContent = 'Dùng tài khoản Google (Gmail) đã được Quản trị cấp quyền.';
  if (tieuDe) {
    // Đã đăng nhập nhưng không đủ quyền vào trang này
    phu.textContent = '';
    var ve = document.createElement('a');
    ve.className = 'nut'; ve.target = '_top';
    ve.href = ((document.getElementById('hakPhanQuyen') || { getAttribute: function () { return ''; } }).getAttribute('data-base') || '') + '?page=tongquan';
    ve.textContent = 'Về trang Tổng quan';
    vung.appendChild(ve);
  } else if (!trang) {
    // Sidebar nhập liệu trong Google Sheet: dùng tài khoản đang mở Sheet, không có nút đăng nhập
    phu.textContent = 'Tài khoản Google đang mở Sheet cần được Quản trị thêm vào danh sách người dùng (Thiết lập › Người dùng & phân quyền).';
  } else if (!cong) {
    phu.textContent = 'Quản trị chưa cấu hình Cổng đăng nhập. Chủ hệ thống hãy mở webapp bằng tài khoản chủ để cấu hình ở trang Thiết lập.';
  } else if (hakDangNhung_()) {
    var nut = document.createElement('button');
    nut.type = 'button'; nut.className = 'nut'; nut.textContent = 'Đăng nhập bằng Google';
    nut.onclick = function () { hakDangNhapCuaSoNho_(cong, trang); };
    vung.appendChild(nut);
  } else {
    var a = document.createElement('a');
    a.className = 'nut'; a.target = '_top';
    a.href = cong + (cong.indexOf('?') >= 0 ? '&' : '?') + 'page=' + encodeURIComponent(trang);
    a.textContent = 'Đăng nhập bằng Google';
    vung.appendChild(a);
  }
  document.getElementById('hakDangNhapTrangThai').textContent = '';
  nen.className = 'hien';
  document.getElementById('hakNguoiDungChip').className = '';
}

/** Đăng nhập khi webapp nằm trong trang khác: Google không cho trang đăng nhập nằm trong khung,
 *  nên mở Cổng ở cửa sổ nhỏ kèm mã yêu cầu ngẫu nhiên; xong thì hỏi máy chủ lấy phiên theo mã đó. */
var hakHoiPhien_ = null;
function hakDangNhapCuaSoNho_(cong, trang) {
  var box = document.getElementById('hakDangNhapTrangThai');
  var bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  var yeuCau = Array.prototype.map.call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  var url = cong + (cong.indexOf('?') >= 0 ? '&' : '?') + 'yc=' + yeuCau + '&page=' + encodeURIComponent(trang);
  var cuaSo = window.open(url, 'hak_hdmb_dang_nhap', 'width=520,height=680');
  box.textContent = cuaSo ? 'Đang chờ đăng nhập ở cửa sổ mới…' : 'Trình duyệt đã chặn cửa sổ bật lên — cho phép cửa sổ bật lên rồi bấm lại.';
  clearInterval(hakHoiPhien_);
  var hetHan = Date.now() + 10 * 60 * 1000;
  hakHoiPhien_ = setInterval(function () {
    if (Date.now() > hetHan) { clearInterval(hakHoiPhien_); box.textContent = 'Hết thời gian chờ - bấm Đăng nhập lại.'; return; }
    google.script.run.withSuccessHandler(function (kq) {
      if (!kq || (!kq.phien && !kq.loi)) return;
      clearInterval(hakHoiPhien_);
      if (kq.loi) { hakHienDangNhap_(kq.loi); return; }
      hakLuuPhien_(kq.phien);
      hakTaiLaiTrang_();
    }).withFailureHandler(function (err) { console.error('nhanPhienDangNhap:', err); }).nhanPhienDangNhap(yeuCau);
  }, 2500);
}

/**
 * Tải lại trang sau khi đăng nhập ở cửa sổ nhỏ. KHÔNG dùng window.location.reload(): khung HTML của webapp Apps Script
 * do Google dựng rồi đổ nội dung vào, tải lại chỉ còn TRANG TRẮNG (user khác chủ hệ thống phải đăng nhập qua Cổng nên
 * nhúng trong Portal là gặp). Xin máy chủ HTML của chính trang đang mở rồi hiện lại trong khung (GiaoDien_Chung).
 */
function hakTaiLaiTrang_() {
  var goc = typeof hakTrangGoc_ === 'function' ? hakTrangGoc_() : null;
  if (!goc || typeof goc.hakChuyenTrangTrongKhung_ !== 'function' || !hakTrangHienTai_()) { window.location.reload(); return; }
  var chay = function (ts) {
    delete ts.sso;
    if (!ts.page) ts.page = hakTrangHienTai_();
    if (!HAK_CO_LUU_TRU && hakPhien_()) ts.ph = hakPhien_(); // trình duyệt chặn bộ nhớ: trang mới nhận phiên qua tham số
    else delete ts.ph;
    goc.hakChuyenTrangTrongKhung_(ts, false);
  };
  var daChay = false;
  var mot = function (ts) { if (!daChay) { daChay = true; chay(ts); } };
  try { google.script.url.getLocation(function (loc) { mot(Object.assign({}, (loc && loc.parameter) || {})); }); } catch (e) { /* không có google.script.url */ }
  setTimeout(function () { mot({}); }, 3000); // getLocation không trả lời -> vẫn tải lại đúng trang
}

function hakDangXuat_() {
  var phien = hakPhien_();
  google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {}).dangXuat(phien);
  hakXoaBoLocDaNho_(); // A4: máy dùng chung — không để lại bộ lọc của người trước
  HAK_NGUOI_DUNG = Object.assign({}, HAK_NGUOI_DUNG || {}, { daDangNhap: false, quyen: [] });
  hakHienDangNhap_('Đã đăng xuất.');
}

/** Ẩn mục menu trái trỏ tới trang không đủ quyền. */
function hakApDungQuyenMenu_() {
  var links = document.querySelectorAll('a[href*="?page="]');
  for (var i = 0; i < links.length; i++) {
    var m = /[?&]page=([a-z]+)/.exec(links[i].getAttribute('href') || '');
    var can = m ? HAK_QUYEN_TRANG[m[1]] : '';
    if (can && !hakCoQuyen_(can)) links[i].style.display = 'none';
  }
}

function hakVeChip_() {
  var nd = HAK_NGUOI_DUNG;
  var chip = document.getElementById('hakNguoiDungChip');
  if (!nd || !nd.daDangNhap) { chip.className = ''; return; }
  document.getElementById('hakChipEmail').textContent = nd.email;
  document.getElementById('hakChipVaiTro').textContent = nd.vaiTroNhan;
  var nut = document.getElementById('hakChipDangXuat');
  nut.style.display = nd.quaPhien ? '' : 'none';
  nut.onclick = hakDangXuat_;
  var nutGd = document.getElementById('hakChipGiaoDien'); // A5: đổi Tự động / Sáng / Tối
  if (typeof hakDoiGiaoDien_ === 'function') { nutGd.onclick = hakDoiGiaoDien_; hakApGiaoDien_(); } else nutGd.style.display = 'none';
  chip.className = 'hien';
}

(function hakKiemTraDangNhap_() {
  var chay = function () {
    var elPq = document.getElementById('hakPhanQuyen');
    var loiTuServer = elPq ? (elPq.getAttribute('data-loi') || '') : '';
    var phienGui = hakPhien_();
    google.script.run.withSuccessHandler(function (nd) {
      HAK_NGUOI_DUNG = nd || null;
      if (!nd || !nd.daDangNhap) { hakHienDangNhap_(loiTuServer || (phienGui ? 'Phiên đăng nhập đã hết hạn - vui lòng đăng nhập lại.' : '')); return; }
      if (nd.phienMoi) hakLuuPhien_(nd.phienMoi);
      hakApDungQuyenMenu_();
      hakVeChip_();
      var can = HAK_QUYEN_TRANG[hakTrangHienTai_()];
      if (can && !hakCoQuyen_(can)) hakHienDangNhap_('Tài khoản ' + nd.email + ' (' + nd.vaiTroNhan + ') không có quyền mở trang này.', '⛔ Không đủ quyền');
    }).withFailureHandler(function (err) {
      console.error('thongTinDangNhap:', err);
    }).thongTinDangNhap(phienGui);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', chay); else chay();
  // Trang để mở lâu: 30 phút hỏi 1 lần để máy chủ gia hạn phiên (không làm gì nếu đăng nhập bằng tài khoản Sheet)
  setInterval(function () {
    var p = hakPhien_();
    if (!p) return;
    google.script.run.withSuccessHandler(function (nd) {
      if (nd && nd.daDangNhap && nd.phienMoi && hakPhien_() === p) hakLuuPhien_(nd.phienMoi);
    }).withFailureHandler(function () { /* mất mạng tạm thời — lần sau thử lại */ }).thongTinDangNhap(p);
  }, 30 * 60 * 1000);
})();

// ---------- Xem file Drive ngay trong hệ thống ----------
// Link Drive mở bằng tài khoản Google của người xem -> Drive đòi "cấp quyền truy cập" nếu tài khoản
// đó chưa được chia sẻ file (hoặc trình duyệt đang dùng 1 tài khoản Google khác). Bấm link Drive của
// ảnh / hồ sơ trong hệ thống giờ mở file qua máy chủ (quyền của chủ hệ thống), không cần quyền Drive.
function hakIdDrive_(href) {
  var m = /^https:\/\/(drive|docs)\.google\.com\/(?:[^?#]*\/d\/([A-Za-z0-9_-]{15,})|(?:open|uc)\?(?:[^#]*&)?id=([A-Za-z0-9_-]{15,}))/.exec(String(href || ''));
  return m ? (m[2] || m[3]) : '';
}
var hakFileDangXem_ = null;
function hakDongXemFile_() {
  document.getElementById('hakXemFile').className = '';
  if (hakFileDangXem_ && hakFileDangXem_.url) URL.revokeObjectURL(hakFileDangXem_.url);
  hakFileDangXem_ = null;
}
function hakThongBaoXemFile_(noiDung) {
  var than = document.getElementById('hakXemFileThan'), tb = document.createElement('div');
  than.innerHTML = ''; tb.className = 'tb'; tb.textContent = noiDung; than.appendChild(tb);
}
function hakXemFile_(id, hrefGoc) {
  var dangXem = hakFileDangXem_ = { id: id };
  document.getElementById('hakXemFileTen').textContent = 'Đang mở file…';
  document.getElementById('hakXemFileDrive').href = hrefGoc;
  document.getElementById('hakXemFileMo').hidden = true;
  document.getElementById('hakXemFileTai').hidden = true;
  hakThongBaoXemFile_('⏳ Đang tải file…');
  document.getElementById('hakXemFile').className = 'hien';
  hakRun_().withSuccessHandler(function (kq) {
    if (hakFileDangXem_ !== dangXem) return;
    // Không phải file của dữ liệu hợp đồng (vd file báo cáo xuất ra) -> mở link Drive như trước
    if (kq && kq.ngoaiDanhMuc) { hakDongXemFile_(); window.open(hrefGoc, '_blank', 'noopener'); return; }
    if (!kq || !kq.thanhCong) { document.getElementById('hakXemFileTen').textContent = 'Không mở được file'; hakThongBaoXemFile_('❌ ' + ((kq && kq.loi) || 'Không mở được file.')); return; }
    var laAnh = /^image\//.test(kq.mime);
    dangXem.ten = kq.ten;
    document.getElementById('hakXemFileTen').textContent = kq.ten;
    document.getElementById('hakXemFileTai').hidden = false;
    document.getElementById('hakXemFileMo').hidden = laAnh;
    var than = document.getElementById('hakXemFileThan');
    than.innerHTML = '';
    if (kq.anh) { var img = document.createElement('img'); img.src = kq.anh; img.alt = kq.ten; than.appendChild(img); }
    if (!laAnh) {
      var ghi = document.createElement('div'); ghi.className = 'tb'; ghi.style.marginLeft = '14px';
      ghi.textContent = (kq.anh ? 'Đang hiện trang đầu. ' : '') + 'Bấm "Mở trong tab mới" để xem toàn bộ file, hoặc "Tải về".';
      than.appendChild(ghi);
    } else if (!kq.anh) hakThongBaoXemFile_('Không tạo được ảnh xem trước — bấm "Tải về" để xem file.');
  }).withFailureHandler(function (err) {
    if (hakFileDangXem_ !== dangXem) return;
    hakThongBaoXemFile_('❌ ' + ((err && err.message) || err));
  }).XEM_FILE_DRIVE(id, 'xem');
}
/** Lấy nội dung đầy đủ của file đang xem rồi mở tab mới (moTab) hoặc tải về máy. */
function hakLayFileDayDu_(moTab) {
  var f = hakFileDangXem_;
  if (!f) return;
  var lam = function () { if (!moTab || !window.open(f.url, '_blank')) hakTaiUrl_(f.url, f.ten); };
  if (f.url) { lam(); return; }
  var nut = document.getElementById(moTab ? 'hakXemFileMo' : 'hakXemFileTai'), goc = nut.textContent;
  nut.textContent = '⏳ Đang tải…'; nut.disabled = true;
  hakRun_().withSuccessHandler(function (kq) {
    nut.textContent = goc; nut.disabled = false;
    if (hakFileDangXem_ !== f) return;
    if (!kq || !kq.thanhCong) { document.getElementById('hakXemFileTen').textContent = '❌ ' + ((kq && kq.loi) || 'Không tải được file.'); return; }
    var bin = atob(kq.base64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    f.url = URL.createObjectURL(new Blob([bytes], { type: kq.mime }));
    f.ten = kq.ten;
    lam();
  }).withFailureHandler(function (err) {
    nut.textContent = goc; nut.disabled = false;
    document.getElementById('hakXemFileTen').textContent = '❌ ' + ((err && err.message) || err);
  }).XEM_FILE_DRIVE(f.id, 'tai');
}
function hakTaiUrl_(url, ten) {
  var a = document.createElement('a');
  a.href = url; a.download = ten || 'file';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
(function () {
  document.getElementById('hakXemFileDong').addEventListener('click', hakDongXemFile_);
  document.getElementById('hakXemFileMo').addEventListener('click', function () { hakLayFileDayDu_(true); });
  document.getElementById('hakXemFileTai').addEventListener('click', function () { hakLayFileDayDu_(false); });
  document.getElementById('hakXemFile').addEventListener('click', function (e) { if (e.target.id === 'hakXemFile') hakDongXemFile_(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && hakFileDangXem_) { e.stopImmediatePropagation(); hakDongXemFile_(); }
  }, true);
  // Bắt mọi link Drive trên trang (kể cả link dựng động sau khi tải dữ liệu)
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var a = e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || a.hasAttribute('data-drive-goc')) return;
    var id = hakIdDrive_(a.getAttribute('href'));
    if (!id) return;
    e.preventDefault();
    hakXemFile_(id, a.href);
  });
})();
</script>
