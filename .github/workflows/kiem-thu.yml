name: Kiểm thử tự động

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Ho_Chi_Minh
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài Playwright + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Cú pháp .gs / .html
        run: node kiem_tra_cu_phap.cjs
      - name: Phản hồi cũ / nhập liệu / lọc 10.000 khách hàng
        run: node chong_phan_hoi_cu.cjs
      - name: Phân quyền tĩnh (hàm ghi, trigger, chặn nhầm)
        run: node test_phan_quyen_tinh.cjs
      - name: Máy chủ (giả lập Apps Script)
        run: node test_may_chu.cjs
      - name: Máy chủ P0 (đồng bộ Draft / thanh toán, chống tạo trùng)
        run: node test_p0_dong_bo.cjs
      - name: Máy chủ P1 (tối ưu đọc Sheet + cache)
        run: node test_p1_hieu_suat.cjs
      - name: Máy chủ (lưu nháp đúng thứ tự)
        run: node test_luu_nhap.cjs
      - name: Máy chủ (danh sách khách hàng gọn)
        run: node test_khach_hang.cjs
      - name: Giao diện (Playwright)
        run: |
          node ui_khoa_nut.cjs
          node ui_hop_thoai_bo_loc.cjs
          node ui_giao_dien.cjs
          node ui_trang_that.cjs
          node ui_giao_dien_dot2.cjs
          node ui_nhung_portal.cjs
          node ui_dinh_dang_so.cjs
          node ui_phan_hoi_cu.cjs
          node ui_tu_luu_nhap.cjs
          node ui_mang_cham.cjs
          node ui_khach_hang.cjs
