name: Kiểm thử tự động

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Ho_Chi_Minh
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài Playwright + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Cú pháp .gs / .html
        run: node kiem_tra_cu_phap.cjs
      - name: Máy chủ (giả lập Apps Script)
        run: node test_may_chu.cjs
      - name: Giao diện (Playwright)
        run: |
          node ui_khoa_nut.cjs
          node ui_hop_thoai_bo_loc.cjs
          node ui_giao_dien.cjs
          node ui_nhung_portal.cjs
