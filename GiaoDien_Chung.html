<!--
  GiaoDien_Chung — A5 (rà soát 28/09): CHẾ ĐỘ TỐI + HỖ TRỢ TRUY CẬP dùng chung cho mọi trang.
  Nạp trong <head> bằng include_('GiaoDien_Chung') (07_Form_HopDong: đầu file).
  - Màu các trang viết dạng var(--ten, #mauSang): biến CHỈ định nghĩa ở chế độ tối -> chế độ sáng giữ nguyên y hệt cũ.
  - Chế độ: 'tu_dong' (theo máy, mặc định) | 'sang' | 'toi' — lưu localStorage 'hak_giao_dien', đổi bằng nút 🌓 cạnh email.
  - Nhãn chưa gắn ô nhập được gắn tự động (bấm chữ nhãn -> vào ô; trình đọc màn hình đọc đúng tên ô);
    nút chỉ có biểu tượng được đặt tên (aria-label) theo title hoặc theo biểu tượng.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  /* ================= GIAO DIỆN MỚI (29/09) — lớp dùng chung cho MỌI trang =================
     Giữ bộ màu portal cũ (menu tối #1f2937, xanh #2563eb, vàng #b45309, nền #f3f4f6). Chỉ đổi hình thức:
     font Be Vietnam Pro, menu có biểu tượng nét, thẻ/nút/ô nhập/bảng bo góc thống nhất, nhãn tình trạng theo màu.
     Tiền tố "html body" để thắng CSS riêng từng trang mà không phải sửa từng file. */
  html body { font-family: "Be Vietnam Pro", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  html body input, html body select, html body textarea, html body button { font-family: inherit; }

  /* Menu trái */
  html body .app-sidebar { width: 250px; min-width: 250px; background: #1f2937; padding: 20px 14px; gap: 2px; }
  html body .app-sidebar .brand { padding: 0 8px 18px 8px; }
  html body .app-sidebar .brand .title { font-size: 15px; font-weight: 700; }
  html body .app-sidebar .nav-group-label { padding: 14px 10px 6px 10px; font-size: 10px; font-weight: 600; letter-spacing: .06em; color: #8b98ab; text-transform: uppercase; }
  html body .app-sidebar .nav-item { min-height: 38px; padding: 0 10px; border-radius: 8px; gap: 12px; font-size: 14px; font-weight: 500; color: #cbd5e1; border-left: 3px solid transparent; }
  html body .app-sidebar .nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
  html body .app-sidebar .nav-item.active { background: #2563eb; color: #fff; border-left-color: #b45309; font-weight: 600; }
  html body .app-sidebar .nav-item .icon { width: 18px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* Vùng nội dung */
  html body .app-main { padding: 28px 32px; }
  html body .page-title { font-size: 24px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 6px; }
  html body .page-subtitle { font-size: 14px; color: var(--chu-phu, #6b7280); margin-bottom: 20px; }
  html body .card { border: 1px solid var(--border-light, #e5e7eb); border-radius: 14px; padding: 20px 22px; box-shadow: none; }
  html body .card h3 { font-size: 16px; font-weight: 700; }
  html body .card > p:not([class]) { font-size: 14px; line-height: 1.55; }
  html body .modal-box { border-radius: 16px; }

  /* Thẻ (tab) */
  html body .tab-bar { gap: 20px; }
  html body .tab-bar a, html body .tab-bar span { padding: 12px 2px; font-size: 14px; font-weight: 500; }
  html body .tab-bar a.active { font-weight: 600; }

  /* Nút */
  html body .btn { padding: 10px 16px; border-radius: 10px; font-weight: 600; line-height: 1.2; transition: background-color .15s, box-shadow .15s; }
  html body .btn-green:hover:not(:disabled) { background: #1d4ed8; }
  html body .btn-outline { background: var(--card-bg, #fff); color: var(--chu-chinh, #1f2937); border: 1px solid var(--vien, #d1d5db); }
  html body .btn-outline:hover:not(:disabled) { background: var(--nen-phu, #f9fafb); }
  html body .btn-purple { background: #1f2937; }

  /* Ô nhập */
  html body .field label { font-size: 12.5px; font-weight: 600; color: var(--chu-chinh, #374151); margin-bottom: 6px; }
  html body .field input:not([type=checkbox]):not([type=radio]):not([type=file]), html body .field select, html body .field textarea {
    padding: 9px 12px; border: 1px solid var(--vien, #d1d5db); border-radius: 9px; font-size: 14px; min-height: 40px; background-color: var(--card-bg, #fff);
  }
  html body .field input:focus, html body .field select:focus, html body .field textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); outline: none; }

  /* Bảng */
  html body table.data-table, html body table.mecon-table { font-size: 13px; }
  html body table.data-table th, html body table.mecon-table th { background: #1f2937; color: #fff; padding: 10px 12px; font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; }
  html body table.data-table td, html body table.mecon-table td { padding: 10px 12px; border-bottom: 1px solid var(--vien, #eef0f3); }
  html body table.data-table tr:hover td, html body table.mecon-table tr:hover td { background: var(--nen-phu, #f9fafb); }

  /* Ô số liệu / thẻ thống kê */
  html body .kpi-card, html body .the-thongke { border: 1px solid var(--border-light, #e5e7eb); border-radius: 14px; padding: 18px 20px; }
  html body .kpi-card .label { font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--chu-phu, #6b7280); }
  html body .kpi-card .value, html body .the-thongke .so { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  html body .the-thongke.active { border: 1.5px solid #2563eb; background: var(--info-bg, #eff6ff); }
  html body .the-thongke.active .so { color: var(--info-chu, #1d4ed8); }

  /* Thông báo */
  html body .msg { border-radius: 10px; padding: 12px 14px; font-size: 13px; }

  /* Nhãn tình trạng (tự tô theo chữ — xem hakToMauTinhTrang_) */
  html body .hak-tt { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  html body .hak-tt-cho { background: #fef3c7; color: #92400e; }
  html body .hak-tt-dang { background: #dbeafe; color: #1e40af; }
  html body .hak-tt-xong { background: #dcfce7; color: #166534; }
  html body .hak-tt-thanhly { background: #e5e7eb; color: #374151; }
  html body .hak-tt-huy { background: #fee2e2; color: #991b1b; }
  html[data-giao-dien="toi"] body .hak-tt-cho { background: #452a07; color: #fbbf24; }
  html[data-giao-dien="toi"] body .hak-tt-dang { background: #1e3a5f; color: #93c5fd; }
  html[data-giao-dien="toi"] body .hak-tt-xong { background: #14532d; color: #4ade80; }
  html[data-giao-dien="toi"] body .hak-tt-thanhly { background: #334155; color: #e5e7eb; }
  html[data-giao-dien="toi"] body .hak-tt-huy { background: #4c1d1d; color: #f87171; }

  @media (max-width: 800px) {
    html body .app-sidebar { width: 100%; min-width: 0; flex-direction: row; overflow-x: auto; padding: 8px; gap: 4px; }
    html body .app-sidebar .brand, html body .app-sidebar .nav-group-label { display: none; }
    html body .app-sidebar .nav-item { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; }
    html body .app-sidebar .nav-item.active { border-left: 0; border-bottom-color: #b45309; }
    html body .app-main { padding: 18px 16px; }
  }

  /* Mục lục dính bên trái trong trang dài (Thiết lập, Hướng dẫn) — dựng bằng hakTaoMucLuc_() */
  html body .hak-co-muc-luc { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
  html body .hak-muc-luc { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; background: var(--card-bg, #fff); border: 1px solid var(--border-light, #e5e7eb); border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  html body .hak-muc-luc .hak-ml-nhan { font-size: 11px; font-weight: 600; color: var(--chu-phu, #6b7280); text-transform: uppercase; letter-spacing: .05em; padding: 2px 10px 8px 10px; }
  html body .hak-muc-luc input { margin: 0 4px 8px 4px; padding: 8px 10px; border: 1px solid var(--vien, #d1d5db); border-radius: 9px; font-size: 13px; background: var(--nen-phu, #f9fafb); color: inherit; }
  html body .hak-muc-luc a { display: block; padding: 7px 10px; border-radius: 8px; color: var(--chu-chinh, #374151); text-decoration: none; font-size: 13.5px; line-height: 1.35; }
  html body .hak-muc-luc a:hover { background: var(--nen-phu, #f3f4f6); }
  html body .hak-muc-luc a.dang-xem { background: var(--info-bg, #dbeafe); color: var(--info-chu, #1e40af); font-weight: 600; }
  @media (max-width: 1000px) { html body .hak-co-muc-luc { display: block; } html body .hak-muc-luc { position: static; max-height: none; margin-bottom: 16px; } }
</style>
<style>
  html[data-giao-dien="toi"] {
    color-scheme: dark;
    --page-bg: #0f172a; --card-bg: #1e293b; --border-light: #334155; --heading: #e5e7eb;
    --active-green: #3b82f6; --accent-gold: #f59e0b;
    --nen-phu: #273449; --chu-chinh: #e5e7eb; --chu-phu: #94a3b8; --vien: #475569;
    --ok-bg: #14532d; --ok-chu: #4ade80;
    --err-bg: #4c1d1d; --err-chu: #f87171;
    --warn-bg: #452a07; --warn-chu: #fbbf24;
    --info-bg: #1e3a5f; --info-chu: #93c5fd;
    --nen-phu-mo: rgba(15,23,42,.97);
  }
  /* :where() -> độ ưu tiên 0: quy tắc riêng của từng trang (class) vẫn thắng */
  :where(html[data-giao-dien="toi"]) body { background-color: var(--page-bg); color: var(--heading); }
  :where(html[data-giao-dien="toi"]) :where(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]), select, textarea) {
    background-color: #0f172a; color: #e5e7eb; border-color: #475569;
  }
  :where(html[data-giao-dien="toi"]) :where(input, textarea)::placeholder { color: #64748b; }
  :where(html[data-giao-dien="toi"]) :where(input, select, textarea):disabled { background-color: #1e293b; color: #94a3b8; }
  :where(html[data-giao-dien="toi"]) :where(th, td) { border-color: #334155; }
  :where(html[data-giao-dien="toi"]) :where(a:not([class])) { color: #93c5fd; }
  :where(html[data-giao-dien="toi"]) :where(code, pre) { background-color: #0f172a; color: #e5e7eb; }
  :where(html[data-giao-dien="toi"]) :where(hr) { border-color: #334155; }
  /* Ảnh / hồ sơ / bản đồ giữ nền trắng để đọc được tài liệu scan trong suốt */
  :where(html[data-giao-dien="toi"]) :where(iframe) { background-color: #fff; }

  /* Hỗ trợ bàn phím: viền rõ khi di chuyển bằng Tab (không hiện khi bấm chuột) */
  :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
<script>
var HAK_KHOA_GIAO_DIEN = 'hak_giao_dien';
var HAK_TEN_GIAO_DIEN = { tu_dong: 'Tự động (theo máy)', sang: 'Sáng', toi: 'Tối' };
var hakCheDoTam_ = null; // chế độ đã chọn trong phiên (dùng khi trình duyệt chặn localStorage)
function hakCheDoGiaoDien_() {
  var c = hakCheDoTam_ || 'tu_dong';
  if (!hakCheDoTam_) { try { c = localStorage.getItem(HAK_KHOA_GIAO_DIEN) || 'tu_dong'; } catch (e) { /* bị chặn -> mặc định */ } }
  return HAK_TEN_GIAO_DIEN[c] ? c : 'tu_dong';
}
function hakApGiaoDien_() {
  var c = hakCheDoGiaoDien_();
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var toi = c === 'toi' || (c === 'tu_dong' && !!(mq && mq.matches));
  document.documentElement.setAttribute('data-giao-dien', toi ? 'toi' : 'sang');
  var nut = document.getElementById('hakChipGiaoDien');
  if (nut) { var ten = 'Giao diện: ' + HAK_TEN_GIAO_DIEN[c] + ' — bấm để đổi'; nut.title = ten; nut.setAttribute('aria-label', ten); }
}
/** Tự động -> Sáng -> Tối -> Tự động. Trả chế độ mới. */
function hakDoiGiaoDien_() {
  var thuTu = ['tu_dong', 'sang', 'toi'];
  var moi = thuTu[(thuTu.indexOf(hakCheDoGiaoDien_()) + 1) % thuTu.length];
  hakCheDoTam_ = moi;
  try { localStorage.setItem(HAK_KHOA_GIAO_DIEN, moi); } catch (e) { /* bị chặn -> chỉ áp dụng trong phiên này */ }
  hakApGiaoDien_();
  return moi;
}
hakApGiaoDien_();
(function () {
  if (!document.documentElement.getAttribute('lang')) document.documentElement.setAttribute('lang', 'vi');
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (mq) {
    var doi = function () { if (hakCheDoGiaoDien_() === 'tu_dong') hakApGiaoDien_(); };
    if (mq.addEventListener) mq.addEventListener('change', doi); else if (mq.addListener) mq.addListener(doi);
  }
})();

/* ---------- Hỗ trợ truy cập: gắn nhãn vào ô + đặt tên nút chỉ có biểu tượng ---------- */
var HAK_TEN_BIEU_TUONG_ = [
  [/🗑/, 'Xóa'], [/✏|📝/, 'Sửa'], [/^\s*[✕×✖❌]\s*$/, 'Đóng'], [/👁/, 'Xem'], [/🔍|🔎/, 'Tìm'], [/⬇|📥/, 'Tải về'],
  [/📋/, 'Sao chép'], [/➕|^\s*\+\s*$/, 'Thêm'], [/🔄|↻|⟳/, 'Tải lại'], [/^\s*[◀‹«←]\s*$/, 'Trang trước'], [/^\s*[▶›»→]\s*$/, 'Trang sau'],
  [/⋮|⋯/, 'Tùy chọn khác'], [/📷|🖼/, 'Ảnh'], [/📍|🗺/, 'Vị trí trên bản đồ'], [/🖨/, 'In'], [/💾/, 'Lưu'], [/♻/, 'Khôi phục'], [/✅|✔/, 'Đồng ý'], [/🌓/, 'Đổi giao diện sáng/tối']
];
var hakDemO_ = 0;
function hakCoChu_(s) { return /[A-Za-z0-9À-ỹ]/.test(s || ''); }
/** Giao diện mới: nhãn tình trạng hợp đồng tô màu theo chữ (Chờ / Đang thực hiện / Hoàn thành / Thanh lý / Hủy). */
var HAK_MAU_TT_ = [[/hủy/i, 'hak-tt-huy'], [/thanh lý/i, 'hak-tt-thanhly'], [/hoàn thành/i, 'hak-tt-xong'], [/đang thực hiện/i, 'hak-tt-dang'], [/chờ/i, 'hak-tt-cho']];
function hakToMauTinhTrang_(goc) {
  var ds = goc.querySelectorAll ? goc.querySelectorAll('.badge-trang-thai, [data-tinh-trang]') : [];
  for (var i = 0; i < ds.length; i++) {
    var el = ds[i], chu = (el.getAttribute('data-tinh-trang') || el.textContent || '').trim(), lop = '';
    for (var k = 0; k < HAK_MAU_TT_.length; k++) if (HAK_MAU_TT_[k][0].test(chu)) { lop = HAK_MAU_TT_[k][1]; break; }
    if (el.getAttribute('data-hak-tt') === lop) continue;
    HAK_MAU_TT_.forEach(function (x) { el.classList.remove(x[1]); });
    if (lop) { el.classList.add('hak-tt', lop); el.style.background = ''; el.style.color = ''; }
    el.setAttribute('data-hak-tt', lop);
  }
}
function hakGanNhanVaTen_(goc) {
  goc = goc || document;
  var nhan = goc.querySelectorAll ? goc.querySelectorAll('label:not([for])') : [];
  for (var i = 0; i < nhan.length; i++) {
    var lb = nhan[i];
    if (lb.querySelector('input,select,textarea')) continue; // ô nằm trong nhãn -> đã gắn sẵn
    var o = null, e = lb.nextElementSibling;
    while (e && !o) {
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName)) o = e;
      else if (e.tagName === 'LABEL') break;
      else if (e.querySelector) { var con = e.querySelectorAll('input,select,textarea'); if (con.length === 1) o = con[0]; else if (con.length > 1) break; }
      e = e.nextElementSibling;
    }
    if (!o && lb.parentElement && lb.parentElement.querySelectorAll('label').length === 1) {
      var ds = lb.parentElement.querySelectorAll('input,select,textarea');
      if (ds.length === 1) o = ds[0];
    }
    if (!o || o.type === 'hidden') continue;
    if (!o.id) o.id = 'hak_o_' + (++hakDemO_);
    lb.htmlFor = o.id;
  }
  hakToMauTinhTrang_(goc);
  var nut = goc.querySelectorAll ? goc.querySelectorAll('button:not([aria-label]), a.btn:not([aria-label]), [role="button"]:not([aria-label])') : [];
  for (var j = 0; j < nut.length; j++) {
    var n = nut[j], chu = (n.textContent || '').trim();
    if (hakCoChu_(chu)) continue;
    var ten = (n.getAttribute('title') || '').trim();
    if (!ten) for (var k = 0; k < HAK_TEN_BIEU_TUONG_.length; k++) if (HAK_TEN_BIEU_TUONG_[k][0].test(chu)) { ten = HAK_TEN_BIEU_TUONG_[k][1]; break; }
    if (ten) n.setAttribute('aria-label', ten);
  }
}
(function () {
  var hen = null;
  var chay = function () { hen = null; try { hakGanNhanVaTen_(document); } catch (e) { /* không để lỗi phụ làm hỏng trang */ } };
  var khoiDong = function () {
    chay();
    if (window.MutationObserver) new MutationObserver(function () { if (!hen) hen = setTimeout(chay, 150); }).observe(document.body, { childList: true, subtree: true });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', khoiDong); else khoiDong();
})();

/**
 * Giao diện mới: mục lục dính bên trái cho trang dài. vung = khung nội dung (vd .app-main);
 * tieuDe = selector các tiêu đề làm mục; khoi(h) = khối bị ẩn khi lọc (mặc định chính tiêu đề);
 * ô tìm lọc mục (và khối) theo chữ. Chỉ DI CHUYỂN phần tử có sẵn (giữ id, sự kiện), không đổi nội dung.
 */
function hakTaoMucLuc_(vung, tieuDe, tuyChon) {
  tuyChon = tuyChon || {};
  if (!vung || vung.querySelector('.hak-muc-luc')) return;
  var ds = Array.prototype.slice.call(vung.querySelectorAll(tieuDe)).filter(function (h) { return (h.textContent || '').trim(); });
  if (ds.length < 3) return;
  var noiDung = document.createElement('div');
  while (vung.firstChild) noiDung.appendChild(vung.firstChild);
  var nav = document.createElement('nav');
  nav.className = 'hak-muc-luc';
  nav.setAttribute('aria-label', tuyChon.nhan || 'Mục lục');
  var nhan = document.createElement('div'); nhan.className = 'hak-ml-nhan'; nhan.textContent = tuyChon.nhan || 'Mục lục'; nav.appendChild(nhan);
  var o = null;
  if (tuyChon.timKiem) { o = document.createElement('input'); o.type = 'search'; o.placeholder = tuyChon.timKiem; o.setAttribute('aria-label', tuyChon.timKiem); nav.appendChild(o); }
  var lk = ds.map(function (h, i) {
    if (!h.id) h.id = 'hak_ml_' + i;
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = (h.textContent || '').replace(/^[^\wÀ-ỹ0-9]+/u, '').trim();
    a.addEventListener('click', function (e) { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    nav.appendChild(a);
    return a;
  });
  var truTop = vung.querySelector('.page-title');
  vung.classList.add('hak-co-muc-luc');
  vung.appendChild(nav); vung.appendChild(noiDung);
  if (truTop && tuyChon.giuTieuDeTren) { vung.parentNode.insertBefore(truTop, vung); }
  var khoi = tuyChon.khoi || function (h) { return h; };
  if (o) o.addEventListener('input', function () {
    var q = o.value.trim().toLowerCase();
    ds.forEach(function (h, i) {
      var k = khoi(h), khop = !q || (k.textContent || '').toLowerCase().indexOf(q) !== -1;
      lk[i].style.display = khop ? '' : 'none';
      if (tuyChon.anKhoi && k) k.style.display = khop ? '' : 'none';
    });
  });
  if (window.IntersectionObserver) {
    var io = new IntersectionObserver(function (es) {
