<!-- Widget chatbot nổi DÙNG CHUNG (CSS + HTML + JS) cho các trang 10, 27, 30 — nạp bằng
     include_('ChatbotWidget') trong scriptlet ngay trước </body>. Trước đây mỗi trang giữ 1 bản sao. -->
<style>
  #chatbotNut { position: fixed; bottom: 20px; right: 20px; width: 54px; height: 54px; border-radius: 50%; background: var(--active-green); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.25); z-index: 999; }
  #chatbotHop { display: none; position: fixed; bottom: 84px; right: 20px; width: 340px; max-width: calc(100vw - 40px); height: 440px; background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.25); z-index: 999; flex-direction: column; overflow: hidden; }
  #chatbotHop.mo { display: flex; }
  #chatbotDauTrang { background: var(--sidebar-bg); color: #fff; padding: 10px 14px; font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  #chatbotDong { cursor: pointer; opacity: .8; }
  #chatbotNoiDung { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
  .chatbot-tin { padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; font-size: 12.5px; line-height: 1.4; max-width: 85%; white-space: pre-wrap; }
  .chatbot-tin-bot { background: #dcfce7; align-self: flex-start; }
  .chatbot-tin-nguoi { background: var(--active-green); color: #fff; margin-left: auto; }
  #chatbotGoNhap { display: flex; border-top: 1px solid var(--border-light); padding: 8px; gap: 6px; }
  #chatbotGoNhap input { flex: 1; border: 1px solid #ccc; border-radius: 6px; padding: 7px 9px; font-size: 12.5px; }
  #chatbotGoNhap button { background: var(--active-green); color: #fff; border: none; border-radius: 6px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; }
  #chatbotAnhDinhKem { padding: 6px 10px; font-size: 11px; color: var(--text-muted); border-top: 1px solid var(--border-light); background: #dcfce7; }
  #chatbotAnhDinhKem a { color: #dc2626; cursor: pointer; margin-left: 4px; }
  #chatbotNutAnh { background: #dcfce7; color: #333; border: 1px solid #ccc; border-radius: 6px; padding: 7px 9px; font-size: 13px; cursor: pointer; flex-shrink: 0; }
</style>
  <div id="chatbotNut" onclick="toggleChatbot()" title="Hỏi chatbot tra cứu dữ liệu">🤖</div>
  <div id="chatbotHop">
    <div id="chatbotDauTrang">🤖 Chatbot tra cứu dữ liệu <span><span id="chatbotXoaNguCanh" title="Xóa ngữ cảnh, hỏi câu hoàn toàn mới" style="cursor:pointer;margin-right:10px">🔄</span><span id="chatbotDong" onclick="toggleChatbot()">✕</span></span></div>
    <div id="chatbotNoiDung">
      <div class="chatbot-tin chatbot-tin-bot">Xin chào! Hỏi mình về hợp đồng, khách hàng, lô rừng, hoặc dán tọa độ (vd "15.733975, 108.126 là rừng ai?") để tra ngược ra đúng lô rừng gần đó. Bấm 📷 để gửi kèm ảnh (CCCD, giấy tờ, phiếu cân...) nhờ đọc/OCR.</div>
    </div>
    <div id="chatbotAnhDinhKem" style="display:none">
      📷 <span id="chatbotTenAnh"></span> <a id="chatbotBoAnhBtn">✕ bỏ</a>
    </div>
    <div id="chatbotGoNhap">
      <input type="file" id="chatbotOAnh" accept="image/*" style="display:none">
      <button id="chatbotNutAnh" title="Đính kèm ảnh để đọc/OCR">📷</button>
      <input id="chatbotOInput" placeholder="Gõ câu hỏi...">
      <button id="chatbotNutGui">Gửi</button>
    </div>
  </div>
<script>
  // ============ WIDGET CHATBOT (nổi, dùng chung mọi trang có nhúng) ============
  function toggleChatbot() { document.getElementById('chatbotHop').classList.toggle('mo'); }
  var chatbotAnhChon_ = null; // { base64, mimeType, tenFile } hoặc null nếu chưa chọn ảnh

  window.addEventListener('DOMContentLoaded', function khoiTaoChatbotWidget_() {
    var elGui = document.getElementById('chatbotNutGui');
    var elInput = document.getElementById('chatbotOInput');
    var elNutAnh = document.getElementById('chatbotNutAnh');
    var elOAnh = document.getElementById('chatbotOAnh');
    var elBoAnh = document.getElementById('chatbotBoAnhBtn');
    if (!elGui) return; // trang chưa nhúng widget này thì bỏ qua
    elGui.addEventListener('click', chatbotGuiCauHoi);
    elInput.addEventListener('keyup', function (e) { if (e.key === 'Enter') chatbotGuiCauHoi(); });
    elNutAnh.addEventListener('click', function () { elOAnh.click(); });
    elBoAnh.addEventListener('click', chatbotBoAnh_);
    var elXoaNguCanh = document.getElementById('chatbotXoaNguCanh');
    if (elXoaNguCanh) elXoaNguCanh.addEventListener('click', chatbotXoaNguCanh_);
    elOAnh.addEventListener('change', function () {
      var file = elOAnh.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        chatbotAnhChon_ = { base64: e.target.result.split(',')[1], mimeType: file.type, tenFile: file.name };
        document.getElementById('chatbotTenAnh').textContent = file.name;
        document.getElementById('chatbotAnhDinhKem').style.display = 'block';
      };
      reader.readAsDataURL(file);
    });
  });
  /** Thoát HTML an toàn RỒI MỚI biến URL (http/https) thành link bấm mở tab mới
   *  — thứ tự bắt buộc: thoát HTML trước để tránh lỗi hiển thị/XSS nếu văn bản
   *  có ký tự đặc biệt, sau đó mới chèn thẻ <a> (không thoát lại các thẻ <a>
   *  vừa tự chèn). */
  function chatbotTaoLinkBamDuoc_(text) {
    // Escape cả dấu nháy và KHÔNG cho link chứa dấu nháy: trả lời của bot có thể lặp lại dữ liệu người dùng
    // nhập, trước đây link dạng https://a.com/"onmouseover="... chèn được thuộc tính vào thẻ <a>.
    var thoatHtml = (text || '').toString()
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    return thoatHtml.replace(/(https?:\/\/[^\s<"'&]+)/g, function (url) {
      return '<a href="' + url + '" target="_blank" style="color:#2563eb;text-decoration:underline">🔗 mở link</a>';
    }).replace(/\n/g, '<br>');
  }
  function chatbotXoaNguCanh_() {
    chatbotCccdGoiY_ = []; chatbotLichSu_ = [];
    var vungTin = document.getElementById('chatbotNoiDung');
    var tinBao = document.createElement('div'); tinBao.className = 'chatbot-tin chatbot-tin-bot'; tinBao.textContent = '🔄 Đã xóa ngữ cảnh — mọi câu hỏi tiếp theo sẽ tính là câu hỏi HOÀN TOÀN MỚI, không còn nhớ khách hàng/hợp đồng đã hỏi trước đó.';
    vungTin.appendChild(tinBao);
    vungTin.scrollTop = vungTin.scrollHeight;
  }
  function chatbotBoAnh_() {
    chatbotAnhChon_ = null;
    document.getElementById('chatbotAnhDinhKem').style.display = 'none';
    document.getElementById('chatbotOAnh').value = '';
  }

  // ⚠️ NÂNG CẤP: nhớ CCCD đã khớp + vài lượt hỏi-đáp gần nhất, gửi kèm mỗi câu
  // hỏi mới -> chatbot hiểu được câu hỏi NỐI TIẾP (vd "còn thanh toán thì sao?")
  // mà không cần gõ lại tên khách hàng mỗi lần.
  var chatbotCccdGoiY_ = [];
  var chatbotLichSu_ = [];
  function chatbotGuiCauHoi() {
    var input = document.getElementById('chatbotOInput');
    var cauHoi = input.value.trim();
    var anhDangGui = chatbotAnhChon_;
    if (!cauHoi && !anhDangGui) return;
    var vungTin = document.getElementById('chatbotNoiDung');
    var tinNguoi = document.createElement('div'); tinNguoi.className = 'chatbot-tin chatbot-tin-nguoi';
    tinNguoi.textContent = (anhDangGui ? '📷 [' + anhDangGui.tenFile + '] ' : '') + cauHoi;
    vungTin.appendChild(tinNguoi);
    input.value = ''; chatbotBoAnh_();
    var tinCho = document.createElement('div'); tinCho.className = 'chatbot-tin chatbot-tin-bot'; tinCho.textContent = anhDangGui ? '⌛ Đang đọc ảnh...' : '⌛ Đang tra cứu...';
    vungTin.appendChild(tinCho);
    vungTin.scrollTop = vungTin.scrollHeight;
    hakRun_()
      .withSuccessHandler(function (kq) {
        var traLoi = kq.thanhCong ? (kq.khongDungAI ? '🔧 ' : '') + kq.traLoi : '❌ ' + kq.loi;
        tinCho.innerHTML = chatbotTaoLinkBamDuoc_(traLoi); // ⚠️ MỚI: trước đây .textContent hiện link dạng chữ thô, không bấm được — giờ tự nhận diện URL trong câu trả lời và biến thành link bấm mở tab mới, tải/xem ảnh và hồ sơ pháp lý ngay
        vungTin.scrollTop = vungTin.scrollHeight;
        if (kq.thanhCong) {
          if (kq.cccdDaKhop && kq.cccdDaKhop.length) chatbotCccdGoiY_ = kq.cccdDaKhop;
          chatbotLichSu_.push({ vaiTro: 'nguoi', noiDung: cauHoi }, { vaiTro: 'bot', noiDung: kq.traLoi });
          chatbotLichSu_ = chatbotLichSu_.slice(-8);
        }
      })
      .withFailureHandler(function (err) { tinCho.textContent = '❌ Lỗi: ' + err.message; vungTin.scrollTop = vungTin.scrollHeight; })
      .TRA_LOI_CHATBOT(cauHoi, chatbotCccdGoiY_, chatbotLichSu_, anhDangGui ? { base64: anhDangGui.base64, mimeType: anhDangGui.mimeType } : null);
  }
</script>
