<!-- Định dạng Ô NHẬP SỐ kiểu Việt Nam: 1.234.567,5 (chấm phân cách hàng nghìn, phẩy thập phân).
     Nạp bằng include_('DinhDangSo_JS'). Chỉ dùng cho số lượng/diện tích/đơn giá/khối lượng/định mức —
     KHÔNG dùng cho năm, giờ, tọa độ GPS, CCCD, SĐT, số tài khoản. -->
<script>
  /** Đọc số từ chuỗi người dùng nhìn thấy/dán vào. Trả NaN nếu trống/không phải số.
   *  Mặc định hiểu kiểu Việt Nam ("1.234" = 1234, "12,5" = 12.5); chuỗi có cả chấm lẫn
   *  phẩy thì dấu đứng sau cùng là dấu thập phân (dán "1,234.5" từ nguồn tiếng Anh vẫn đúng). */
  function docSoVN_(v) {
    if (typeof v === 'number') return v;
    var s = (v === null || v === undefined ? '' : String(v)).replace(/[\s đ₫]/g, '');
    if (!s) return NaN;
    var coPhay = s.indexOf(',') !== -1, coCham = s.indexOf('.') !== -1;
    if (coPhay && coCham) {
      s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (coPhay) {
      s = s.split(',').length > 2 ? s.replace(/,/g, '') : s.replace(',', '.');
    } else if (coCham && (s.split('.').length > 2 || /^-?\d{1,3}\.\d{3}$/.test(s))) {
      s = s.replace(/\./g, '');
    }
    return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? Number(s) : NaN;
  }

  /** Số (hoặc chuỗi số kiểu JS "1234.5") -> "1.234,5". Trống/không phải số -> ''. */
  function dinhDangSoVN_(v) {
    if (v === '' || v === null || v === undefined) return '';
    var n = typeof v === 'number' ? v : Number(v);
    if (isNaN(n)) n = docSoVN_(v);
    if (isNaN(n)) return '';
    var s = String(Math.round(n * 1e6) / 1e6);
    if (/e/i.test(s)) s = n.toFixed(6).replace(/\.?0+$/, '');
    var am = s.charAt(0) === '-';
    if (am) s = s.slice(1);
    var p = s.split('.');
    return (am ? '-' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : '');
  }

  /** Gắn định dạng cho 1 ô: thêm dấu phân cách NGAY KHI GÕ (giữ đúng vị trí con trỏ),
   *  dấu chấm vừa gõ được hiểu là dấu thập phân. el: phần tử hoặc id. */
  function ganDinhDangSo_(el) {
    if (typeof el === 'string') el = document.getElementById(el);
    if (!el || el.dataset.dinhDangSo) return;
    el.dataset.dinhDangSo = '1';
    if (el.type === 'number') el.type = 'text';
    el.setAttribute('inputmode', 'decimal');
    el.setAttribute('autocomplete', 'off');
    // Bộ gõ tiếng Việt (Telex/VNI trên máy Mac, Laban Key...) và nhiều bàn phím điện thoại gõ theo CỤM ĐANG SOẠN:
    // sửa ô trong lúc đang soạn làm cụm chữ bị chèn lại lẫn lộn (gõ 35000 ra 3,500354). Đang soạn -> để nguyên,
    // soạn xong (compositionend) mới định dạng 1 lần.
    var dangSoan = false;
    el.addEventListener('compositionstart', function () { dangSoan = true; el._truocKhiGo = undefined; }, true);
    el.addEventListener('compositionend', function () {
      dangSoan = false;
      el._truocKhiGo = undefined;
      el.dispatchEvent(new InputEvent('input', { inputType: 'insertText', data: null }));
    }, true);
    el.addEventListener('beforeinput', function (e) {
      if (dangSoan || e.isComposing) return;
      var caO = el.selectionStart === 0 && el.selectionEnd === el.value.length; // bôi đen cả ô rồi gõ/dán = thay cả ô
      el._truocKhiGo = caO ? '' : el.value;
    }, true);
    el.addEventListener('input', function (e) {
      if (dangSoan || e.isComposing || e.inputType === 'insertCompositionText') { e.stopImmediatePropagation(); return; }
      var v = el.value, pos = el.selectionStart === null ? v.length : el.selectionStart;
      // Dán / kéo thả số "1,234.5" vào ô TRỐNG (hoặc thay cả ô) -> đọc lại cả ô như số dán vào.
      // Không áp dụng khi ô đã có số: ghép chuỗi đã định dạng "3.500" + "0" rồi đọc lại sẽ ra 3,5.
      if ((e.inputType === 'insertFromPaste' || e.inputType === 'insertFromDrop' || e.inputType === 'insertReplacementText' ||
          (e.data && e.data.length > 1)) && !el._truocKhiGo) {
        el.value = dinhDangSoVN_(docSoVN_(v));
        return;
      }
      // Xóa trúng dấu chấm phân cách (chữ số không đổi) -> xóa luôn chữ số kề bên, nếu không dấu chấm sẽ hiện lại ngay
      var chiSo = function (x) { return String(x || '').replace(/[^\d,-]/g, ''); };
      if (el._truocKhiGo !== undefined && chiSo(v) === chiSo(el._truocKhiGo)) {
        if (e.inputType === 'deleteContentBackward' && pos > 0) { v = v.slice(0, pos - 1) + v.slice(pos); pos--; }
        else if (e.inputType === 'deleteContentForward' && pos < v.length) v = v.slice(0, pos) + v.slice(pos + 1);
      }
      if (e.data === '.' && pos > 0 && v.charAt(pos - 1) === '.') v = v.slice(0, pos - 1) + ',' + v.slice(pos);
      var am = /^\s*-/.test(v);
      var truocConTro = v.slice(0, pos).replace(/[^\d,]/g, '').length;
      var s = v.replace(/[^\d,]/g, '');
      var iPhay = s.indexOf(',');
      var nguyen = iPhay === -1 ? s : s.slice(0, iPhay);
      var le = iPhay === -1 ? null : s.slice(iPhay + 1).replace(/,/g, '');
      var boiDau = nguyen.length - nguyen.replace(/^0+(?=\d)/, '').length; // số 0 thừa ở đầu bị bỏ
      nguyen = nguyen.replace(/^0+(?=\d)/, '');
      var them0 = nguyen === '' && le !== null; // gõ "," trước -> "0,"
      if (them0) nguyen = '0';
      var kq = (am ? '-' : '') + nguyen.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (le === null ? '' : ',' + le);
      el.value = kq;
      var canDem = Math.max(0, truocConTro - boiDau) + (them0 ? 1 : 0), viTri = am ? 1 : 0;
      for (var dem = 0; viTri < kq.length && dem < canDem; viTri++) if (/[\d,]/.test(kq.charAt(viTri))) dem++;
      try { el.setSelectionRange(viTri, viTri); } catch (e2) { /* ô không hỗ trợ chọn vị trí */ }
    }, true); // pha capture: chạy TRƯỚC oninput="..." sẵn có của ô (tự tính khối lượng...) để hàm đó đọc số đã chuẩn
    el.addEventListener('blur', function () { el.value = dinhDangSoVN_(docSoVN_(el.value)); }); // bỏ dấu phẩy thừa ở cuối "12,"
    if (el.value !== '') { // giá trị có sẵn khi dựng form = số thô từ máy chủ ("35000.5")
      var n0 = Number(el.value);
      el.value = dinhDangSoVN_(isNaN(n0) ? docSoVN_(el.value) : n0);
    }
  }
</script>
