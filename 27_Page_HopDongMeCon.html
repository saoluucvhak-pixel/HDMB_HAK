<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
<style>

  :root {
    --sidebar-bg: #1f2937;
    --sidebar-bg-2: #2d3a4d;
    --active-green: #2563eb;
    --accent-gold: #b45309;
    --accent-purple: #1f2937;
    --text-light: #cbd5e1;
    --text-muted: #8b98ab;
    --card-bg: #ffffff;
    --page-bg: #f3f4f6;
    --border-light: #e5e7eb;
    --heading: #1f2937;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; display: flex; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--page-bg); color: var(--heading);
  }

  /* ---------- SIDEBAR ---------- */
  .app-sidebar {
    width: 250px; min-width: 250px; background: var(--sidebar-bg);
    color: var(--text-light); display: flex; flex-direction: column; padding: 18px 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 18px 20px 18px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent-gold);
    display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent-gold); font-size: 12px;
  }
  .brand .title { font-weight: bold; color: #fff; font-size: 15px; line-height: 1.2; }
  .brand .subtitle { font-size: 11px; color: var(--text-muted); }

  .nav-group-label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); padding: 14px 18px 4px 18px; letter-spacing: .05em; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: var(--text-light);
    text-decoration: none; font-size: 13px; cursor: pointer; border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.05); }
  .nav-item.active { background: var(--active-green); color: #fff; border-left-color: var(--accent-gold); font-weight: 600; }
  .nav-item .icon { width: 18px; text-align: center; }

  /* ---------- MAIN CONTENT ---------- */
  .app-main { flex: 1; padding: 26px 30px; overflow-y: auto; }
  .page-title { font-size: 22px; font-weight: 800; margin: 0 0 4px 0; color: var(--heading); }
  .page-subtitle { font-size: 13px; color: var(--chu-phu, #667); margin: 0 0 18px 0; }

  .tab-bar { display: flex; gap: 6px; border-bottom: 1px solid var(--border-light); margin-bottom: 18px; }
  .tab-bar a, .tab-bar span {
    padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--chu-phu, #667); text-decoration: none;
    border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px;
  }
  .tab-bar a.active { color: var(--active-green); border-bottom-color: var(--active-green); }

  .card {
    background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 10px;
    padding: 20px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card h3 { margin: 0 0 14px 0; font-size: 15px; }

  /* Modal "Xem chi tiết lô rừng" — nổi giữa màn hình, không phụ thuộc vị trí
     cuộn trang, vì bảng Hồ sơ rừng có thể rất dài (hàng trăm dòng) khiến card
     cũ (nằm ngay sau bảng, theo dòng chảy trang bình thường) bị đẩy xuống tít
     dưới, người dùng phải cuộn rất xa mới thấy. */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,35,27,0.55);
    z-index: 1000; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto;
  }
  .modal-overlay.mo { display: flex; }
  .modal-box {
    background: var(--card-bg); border-radius: 12px; padding: 22px 24px;
    max-width: 640px; width: 100%; max-height: calc(100vh - 80px); overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }

  .field-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 160px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--chu-phu, #445); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border-light); border-radius: 6px; font-size: 13px;
  }

  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border: none; border-radius: 7px;
    font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-green { background: var(--active-green); color: #fff; }
  .btn-gold { background: var(--accent-gold); color: #fff; }
  .btn-purple { background: var(--accent-purple); color: #fff; }
  .btn-outline { background: var(--nen-phu, #f3f4f6); color: var(--chu-chinh, #1f2937); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }

  .kpi-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .kpi-card {
    flex: 1; min-width: 200px; background: var(--card-bg); border: 1px solid var(--border-light);
    border-radius: 10px; padding: 18px 20px;
  }
  .kpi-card .label { font-size: 11px; font-weight: 700; color: var(--chu-phu, #889); letter-spacing: .03em; }
  .kpi-card .value { font-size: 26px; font-weight: 800; margin-top: 6px; color: var(--heading); }

  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; }
  .msg.ok { background: var(--ok-bg, #dcfce7); color: var(--ok-chu, #16a34a); border-left: 4px solid #16a34a; }
  .msg.err { background: var(--err-bg, #fee2e2); color: var(--err-chu, #dc2626); border-left: 4px solid #dc2626; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.data-table th { background: var(--sidebar-bg); color: #fff; padding: 8px; text-align: left; }
  table.data-table td { border-bottom: 1px solid var(--border-light); padding: 8px; }

  @media (max-width: 800px) {
    body { flex-direction: column; }
    .app-sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 10px; }
    .brand { display: none; }
    .nav-group-label { display: none; }
    .nav-item { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .nav-item.active { border-left: none; border-bottom-color: var(--accent-gold); }
  }
</style>
<style>
  .khung-den { background: var(--sidebar-bg); color: #fff; border-radius: 10px; padding: 18px 22px; margin-bottom: 16px; }
  .khung-den h3 { margin: 0 0 4px 0; }
  .header-hs { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg, #fff); border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; border: 1px solid var(--border-light); }
  .header-hs .ten { font-size: 17px; font-weight: 700; }
  .header-hs .badge-ma { background: var(--ok-bg, #dcfce7); color: var(--active-green); border-radius: 20px; padding: 2px 10px; font-size: 11px; margin-left: 8px; }
  .header-hs .badge-tt { background: var(--ok-bg, #dcfce7); color: var(--active-green); border-radius: 20px; padding: 2px 10px; font-size: 11px; margin-left: 6px; }

  .card-con { background: var(--card-bg, #fff); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; border: 1px solid var(--border-light); }
  .card-con-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .card-con-head h4 { margin: 0 0 3px 0; font-size: 14px; }

  table.mecon-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.mecon-table th { background: var(--sidebar-bg); color: #fff; text-align: left; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
  table.mecon-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-light); }
  table.mecon-table tr:hover td { background: var(--ok-bg, #dcfce7); }
  a.lnk-hd { color: var(--active-green); font-weight: 600; cursor: pointer; text-decoration: none; }
  a.lnk-hd:hover { text-decoration: underline; }
  a.lnk-sua { color: var(--active-green); cursor: pointer; font-size: 12px; }
  a.lnk-huy { color: var(--err-chu, #dc2626); cursor: pointer; font-size: 12px; margin-left: 8px; }
  .breadcrumb { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
  .breadcrumb a { color: var(--active-green); cursor: pointer; text-decoration: none; }
  .tabbar2 { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 2px solid var(--border-light); flex-wrap: wrap; }
  .tabbar2 .tabitem { padding: 9px 16px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tabbar2 .tabitem.active { color: var(--active-green); border-bottom-color: var(--active-green); }
  .empty-hint { text-align: center; padding: 24px; color: var(--text-muted); font-size: 12.5px; }
  .badge-trang-thai { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; background: var(--ok-bg, #dcfce7); color: var(--active-green); }
  .row-search { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
  .row-search input { flex: 1; max-width: 340px; padding: 8px 10px; border: 1px solid var(--vien, #ccc); border-radius: 6px; font-size: 13px; }

  /* ---- MODAL WIZARD (đúng kiểu ảnh mẫu: Bước 1/2/3, mỗi bước chỉ 1 nhóm nội dung) ---- */
  .modal-overlay-kh { display: none; position: fixed; inset: 0; background: rgba(20,35,27,0.55); z-index: 1000; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto; }
  .modal-overlay-kh.mo { display: flex; }
  .modal-box-kh { background: var(--card-bg); border-radius: 12px; padding: 22px 26px; max-width: 620px; width: 100%; max-height: calc(100vh - 60px); overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
  .wizard-buoc { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .wizard-buoc .cham { width: 26px; height: 26px; border-radius: 50%; background: var(--border-light); color: var(--chu-phu, #888); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .wizard-buoc .cham.active { background: var(--accent-gold); color: #fff; }
  .wizard-buoc .cham.done { background: var(--active-green); color: #fff; }
  .wizard-buoc .duong { flex: 1; height: 2px; background: var(--border-light); }
  .wizard-nhan { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; }
  .flabel { font-size: 12px; font-weight: 600; display: block; margin-bottom: 4px; margin-top: 10px; }
  .finput { width: 100%; padding: 8px 10px; border: 1px solid var(--vien, #ccc); border-radius: 6px; font-size: 13px; }
  .form2col { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
  .form2col .full { grid-column: 1 / -1; }
  .ds-kh-ket-qua { max-height: 260px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--border-light); border-radius: 8px; }
  .ds-kh-dong { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--border-light); font-size: 13px; }
  .ds-kh-dong:last-child { border-bottom: none; }
  .ds-kh-dong:hover { background: var(--ok-bg, #dcfce7); }
  .ds-kh-dong .ten { font-weight: 600; }
  .ds-kh-dong .phu { color: var(--text-muted); font-size: 11.5px; }
  .wizard-nut-hang { display: flex; justify-content: space-between; margin-top: 18px; }
</style>

<?!= menuChung_(typeof currentPage === 'undefined' ? '' : currentPage, typeof baseUrl === 'undefined' ? '' : baseUrl, typeof tabTrang === 'undefined' ? '' : tabTrang) ?>

  <div class="app-main">
    <div id="vungChinh"></div>
  </div>

  <div class="modal-overlay-kh" id="modalChung" onclick="if(event.target===this) dongModal()">
    <div class="modal-box-kh" id="modalChungNoiDung"></div>
  </div>

<script>
  // ============ TIỆN ÍCH DÙNG CHUNG ============
  // Thông báo nổi KHÔNG chặn thao tác (thay cho alert()): tự tắt sau vài giây, bấm để đóng,
  // màu theo tiền tố ❌ / ⚠️ / ✅ sẵn có của nội dung, trình đọc màn hình đọc được (aria-live).
  function thongBao_(noiDung) {
    var s = String(noiDung === null || noiDung === undefined ? '' : noiDung);
    var loai = /^❌/.test(s) ? 'loi' : /^⚠️/.test(s) ? 'canhbao' : /^✅/.test(s) ? 'ok' : 'tin';
    var hop = document.getElementById('hakToastHop');
    if (!hop) {
      hop = document.createElement('div'); hop.id = 'hakToastHop';
      hop.setAttribute('role', 'status'); hop.setAttribute('aria-live', 'polite');
      hop.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:100000;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 24px))';
      document.body.appendChild(hop);
    }
    var o = document.createElement('div');
    o.textContent = s; o.title = 'Bấm để đóng'; o.className = 'hak-toast hak-toast-' + loai;
    o.style.cssText = 'background:' + { loi: '#dc2626', canhbao: '#b45309', ok: '#16a34a', tin: '#1f2937' }[loai] +
      ';color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:13px;line-height:1.45;white-space:pre-line;word-break:break-word;cursor:pointer';
    o.onclick = function () { if (o.parentNode) o.parentNode.removeChild(o); };
    hop.appendChild(o);
    setTimeout(function () { if (o.parentNode) o.parentNode.removeChild(o); }, loai === 'loi' ? 12000 : 6000);
  }
  function urlAnToan_(u) { u = (u || '').toString().trim(); return /^https?:\/\//i.test(u) ? escHtml_(u) : '#'; } // chỉ nhận link http(s)
  function escHtml_(s) { return (s === null || s === undefined ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); } // escape cả dấu nháy: giá trị có " trong value="..." không bị cắt cụt khi sửa rồi lưu
  function formatSo_(v) { return Math.round(Number(v) || 0).toLocaleString('vi-VN'); }
  function formatTien_(v) { return Math.round(Number(v) || 0).toLocaleString('vi-VN'); }
  function chuyenNgay_(v) { return v ? v.toString().split('T')[0] : ''; }
  function moModal(html) { document.getElementById('modalChungNoiDung').innerHTML = html; document.getElementById('modalChung').classList.add('mo'); }
  function dongModal() { document.getElementById('modalChung').classList.remove('mo'); document.getElementById('modalChungNoiDung').innerHTML = ''; }
  function showMsgModal_(text) { var el = document.getElementById('msgModal'); if (el) { el.style.display = 'block'; el.textContent = text; } }
  var DINH_MUC_TAN_TREN_HA = 120;
  /** Đọc số từ ô đang hiển thị kiểu VN "1.234.567,5" (DinhDangSo_JS.html). Trống/sai -> 0. */
  function layGiaTriSoTuChuoi_(str) {
    var n = docSoVN_(str);
    return isNaN(n) ? 0 : n;
  }
  /** Ô số: phân cách hàng nghìn + giữ phần thập phân, định dạng ngay khi gõ (DinhDangSo_JS.html). */
  function ganDinhDangSoKhiGo_(id) { ganDinhDangSo_(id); }
  var khachHangCoSan_ = [];
  var timerTim_ = null;

  window.addEventListener('DOMContentLoaded', function () {
    // ⚠️ ĐÃ SỬA: trước đây tải TOÀN BỘ khách hàng (quét cả HD_NCC) NGAY LÚC MỞ TRANG,
    // CỘNG THÊM 1 lượt quét y hệt nữa để hiện danh sách 20 dòng đầu — tốn gấp đôi thời
    // gian mở trang dù người dùng chưa chắc cần đến. Giờ chỉ tải danh sách hiển thị
    // (rẻ hơn nhiều lần vì có phân trang phía server); danh sách ĐẦY ĐỦ để tìm kiếm
    // trong wizard/form chỉ tải LƯỜI — đúng lúc bấm "Thêm hợp đồng"/"Thêm khách hàng".
    var idHDTuUrl = new URLSearchParams(window.location.search).get('idHD');
    if (idHDTuUrl) { moChiTietHopDong(idHDTuUrl); } else { veDanhSachKhachHang(); }
  });
  var daTaiKhachHangDayDu_ = false;
  /** Tải lười — chỉ gọi lần đầu tiên cần đến (mở wizard/form thêm hợp đồng), các lần sau dùng lại cache */
  function damBaoDaTaiKhachHangDayDu_(khiXong) {
    if (daTaiKhachHangDayDu_) { khiXong(); return; }
    hakRun_().withSuccessHandler(function (kq) { khachHangCoSan_ = kq.items || []; daTaiKhachHangDayDu_ = true; khiXong(); }).withFailureHandler(function (err) { thongBao_('❌ Lỗi tải danh sách khách hàng: ' + err.message); }).layDanhSachKhachHang(1, 5000, '');
  }

  // ============ TRANG 1: DANH MỤC KHÁCH HÀNG (GỐC) ============
  function veDanhSachKhachHang() { renderDanhSachKhachHang(1); }

  function renderDanhSachKhachHang(trang) {
    trang = trang || 1;
    var el = document.getElementById('vungChinh');
    el.innerHTML =
      '<div class="page-title">Khách hàng</div>' +
      '<div class="page-subtitle">1 khách hàng có thể có nhiều hợp đồng — bấm vào 1 khách hàng để xem danh sách hợp đồng đã ký.</div>' +
      '<div class="card"><div class="card-con-head">' +
      '<div class="row-search" style="margin-bottom:0"><input id="oTimKHRoot" placeholder="Tìm theo tên chủ rừng / mã khách hàng (CCCD)... — gõ là lọc ngay"></div>' +
      '<button class="btn btn-green" id="btnThemKH">➕ Thêm khách hàng</button>' +
      '</div><div id="vungBangKH"><p class="hint">⌛ Đang tải...</p></div><div id="phanTrangKH" style="margin-top:10px"></div></div>';
    document.getElementById('btnThemKH').addEventListener('click', function () { moWizardThemHopDong(); });
    document.getElementById('oTimKHRoot').addEventListener('input', function () {
      clearTimeout(timerTim_);
      timerTim_ = setTimeout(function () { taiBangKhachHang_(1); }, 350); // ⚠️ CHỈ tải lại bảng kết quả — TUYỆT ĐỐI không gọi lại renderDanhSachKhachHang() ở đây, vì hàm đó dựng lại cả ô input, sẽ xóa mất chữ vừa gõ ngay khi debounce chạy
    });
    taiBangKhachHang_(trang);
  }
  function taiBangKhachHang_(trang) {
    var tuKhoa = document.getElementById('oTimKHRoot').value;
    var elBang = document.getElementById('vungBangKH');
    hakRun_()
      .withSuccessHandler(function (kq) {
        if (!kq.items || !kq.items.length) { elBang.innerHTML = '<div class="empty-hint">Không có khách hàng nào khớp.</div>'; document.getElementById('phanTrangKH').innerHTML = ''; return; }
        var table = document.createElement('table'); table.className = 'mecon-table';
        table.innerHTML = '<thead><tr><th>Tên chủ rừng</th><th>Số CCCD</th><th>SĐT</th><th>Nhóm KH</th><th>Số hợp đồng</th><th></th></tr></thead>';
        var tbody = document.createElement('tbody');
        kq.items.forEach(function (r) {
          var tr = document.createElement('tr');
          tr.innerHTML = '<td><a class="lnk-hd">' + escHtml_(r.tenChuRung) + '</a></td><td>' + escHtml_(r.cccd) + '</td><td>' + escHtml_(r.sdt) + '</td>' +
            '<td>' + escHtml_(r.nhomKH) + '</td><td>' + escHtml_(r.soLuongHopDong) + ' hợp đồng' + (r.soLuongHopDong > 1 ? '<span class="badge-kh">nhiều HĐ</span>' : '') + '</td><td></td>';
          tr.querySelector('a').addEventListener('click', function () { moKhachHang(r.cccd, r.tenChuRung); });
          var tdNut = tr.lastElementChild;
          var lnkXem = document.createElement('a'); lnkXem.className = 'lnk-sua'; lnkXem.textContent = 'Xem →';
          lnkXem.addEventListener('click', function () { moKhachHang(r.cccd, r.tenChuRung); });
          tdNut.appendChild(lnkXem);
          tbody.appendChild(tr);
        });
        table.appendChild(tbody); elBang.innerHTML = ''; elBang.appendChild(table);

        var elTrang = document.getElementById('phanTrangKH'); elTrang.innerHTML = '';
        var bT = document.createElement('button'); bT.className = 'btn btn-outline'; bT.textContent = '‹ Trước'; bT.disabled = kq.trang <= 1;
        bT.addEventListener('click', function () { taiBangKhachHang_(kq.trang - 1); });
        var sp = document.createElement('span'); sp.style.margin = '0 10px'; sp.textContent = 'Trang ' + kq.trang + '/' + kq.tongTrang + ' (' + kq.tongSo + ' khách hàng)';
        var bS = document.createElement('button'); bS.className = 'btn btn-outline'; bS.textContent = 'Sau ›'; bS.disabled = kq.trang >= kq.tongTrang;

    // Bước 1) — nếu người dùng đã gõ/sửa rồi bấm "Quay lại" rồi "Tiếp tục" lại,

  /** Gắn 1 cặp nút+input file để "Đọc scan" — chọn ảnh/PDF, gọi OCR_TU_BAN_SCAN,
   *  rồi giao lại cho xuLyKetQua(truong) tự quyết định điền vào ô nào. */
  function themNutDocScan_(idNut, idFile, loaiTaiLieu, xuLyKetQua) {
    var elNut = document.getElementById(idNut), elFile = document.getElementById(idFile);
    if (!elNut || !elFile) return;
    var nhanGoc = elNut.textContent;
    elNut.addEventListener('click', function () { elFile.click(); });
    elFile.addEventListener('change', function () {
      var file = elFile.files[0]; if (!file) return;
      elNut.disabled = true; elNut.textContent = '⌛ Đang đọc scan...';
      var reader = new FileReader();
      reader.onload = function (e) {
        var base64 = e.target.result.split(',')[1];
        hakRun_()
          .withSuccessHandler(function (kq) {
            elNut.disabled = false; elNut.textContent = nhanGoc; elFile.value = '';
            if (!kq.thanhCong) { thongBao_('❌ ' + kq.loi); return; }
            xuLyKetQua(kq.truong, kq);
          })
          .withFailureHandler(function (err) { elNut.disabled = false; elNut.textContent = nhanGoc; thongBao_('❌ Lỗi đọc scan: ' + err.message); })
          .OCR_TU_BAN_SCAN(loaiTaiLieu, base64, file.type, file.name);
      };
      reader.readAsDataURL(file);
    });
  }

  function truongChonNganHang_(id, nhan, giaTriHienTai) {
    return '<div><label class="flabel">' + nhan + '</label>' +
      '<select class="finput" id="' + id + '"><option value="">⌛ Đang tải danh sách ngân hàng...</option></select></div>';

  function napChonNganHang_(idSelect, giaTriHienTai) {
    var elSelect = document.getElementById(idSelect);
    if (!elSelect) return;
    hakRun_()
      .withSuccessHandler(function (list) {
        elSelect.innerHTML = '<option value="">-- Chọn ngân hàng --</option>';
        var daKhopSan = false;
        list.forEach(function (b) {
          var o = document.createElement('option'); o.value = b.ten; o.textContent = b.ten + ' — ' + b.tenDayDu;
          if (giaTriHienTai && b.ten.toLowerCase() === giaTriHienTai.toLowerCase()) { o.selected = true; daKhopSan = true; }
          elSelect.appendChild(o);
        });
        // Giá trị cũ đã lưu không khớp đúng tên chuẩn nào (dữ liệu cũ gõ tự do trước đây) -> vẫn giữ nguyên, thêm làm 1 lựa chọn riêng để không mất dữ liệu
        if (giaTriHienTai && !daKhopSan) {
          var oCu = document.createElement('option'); oCu.value = giaTriHienTai; oCu.textContent = giaTriHienTai + ' (đã lưu trước đây)'; oCu.selected = true;
          elSelect.insertBefore(oCu, elSelect.children[1]);
        }
      })
      .withFailureHandler(function (err) {
        // Tải danh sách lỗi (vd mất mạng) -> đổi tạm sang ô nhập chữ bình thường, không chặn người dùng thao tác tiếp

    document.getElementById('lnkBcKH2').addEventListener('click', function () { moKhachHang(h.cccdChuRung, h.tenChuRung); });
    document.getElementById('lnkBcHD2').addEventListener('click', function () { moChiTietHopDong(h.idHD); });
    el.querySelectorAll('.tabitem').forEach(function (t) { t.addEventListener('click', function () { chonTabRung(t.dataset.tab); }); });
    if (ctxRung.tab === 'gps') renderTabGPS_(idRung); else renderTabAnhRung_(h.idHD, idRung);
  }

  function renderTabGPS_(idRung) {
    var el = document.getElementById('vungTabRung');
    var coTheSua = coTheSuaHopDong_(ctxRung.h.tinhTrang);
    el.innerHTML = '<div class="card-con"><div class="card-con-head"><div><h4>📍 Tọa độ GPS</h4><p>Điểm tọa độ đã đo cho lô rừng này. Ảnh đính kèm ở đây (nếu có) là ẢNH CÓ TEM TỌA ĐỘ (kiểu app "GPS Map Camera") — KHÁC với ảnh hiện trạng rừng ở tab "Ảnh" và file hồ sơ pháp lý ở tab "Lô rừng".</p></div></div><div class="vung-bang-gps"><p class="hint">⌛ Đang tải...</p></div></div>' +
      (coTheSua ? '<div class="card-con" style="margin-top:12px">' +
      '<label class="flabel" style="margin-top:0">Thêm điểm mới</label><div class="form2col">' +
      '<input class="finput" id="oGpsLat" placeholder="Vĩ độ (vd 15.733975)"><input class="finput" id="oGpsLng" placeholder="Kinh độ (vd 108.126)"></div>' +
      '<div style="margin-top:8px"><input type="file" id="oGpsAnh" accept="image/*,application/pdf" style="display:none">' +
      '<button class="btn btn-outline" id="btnChonAnhGps" type="button" style="padding:5px 10px;font-size:11.5px">📷 Ảnh minh chứng (tùy chọn — tự đọc tọa độ trên ảnh nếu có)</button>' +
      '<span id="tenAnhGps" class="hint" style="margin-left:6px"></span></div>' +
      '<button class="btn btn-green" id="btnThemGps" style="margin-top:8px;padding:6px 14px;font-size:12px">➕ Thêm điểm</button>' +
      '<div id="msgGpsMC" class="hint" style="margin-top:6px"></div></div>' : '<p class="hint">🔒 Hợp đồng đã "' + escHtml_(ctxRung.h.tinhTrang) + '" — chỉ xem, không thêm điểm mới được.</p>');
    if (coTheSua) {
      document.getElementById('btnChonAnhGps').addEventListener('click', function () { document.getElementById('oGpsAnh').click(); });
      document.getElementById('oGpsAnh').addEventListener('change', function () {
        var file = this.files[0];
        document.getElementById('tenAnhGps').textContent = file ? '✅ ' + file.name : '';
        if (!file) return;
        // ⚠️ MỚI: tự đọc tem tọa độ trên ảnh (nếu có) và điền luôn vào 2 ô Vĩ độ/Kinh
        // độ khi còn trống — đỡ phải gõ tay nếu ảnh đã có sẵn tọa độ in trên đó.
        var reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById('msgGpsMC').textContent = '⌛ Đang thử đọc tọa độ trên ảnh...';
          hakRun_()
            .withSuccessHandler(function (kq) {
              if (kq.thanhCong) {
                var oLat = document.getElementById('oGpsLat'), oLng = document.getElementById('oGpsLng');
                if (!oLat.value) oLat.value = kq.lat;
                if (!oLng.value) oLng.value = kq.lng;
                document.getElementById('msgGpsMC').textContent = '✅ Đã đọc được tọa độ trên ảnh, tự điền vào 2 ô trên — kiểm tra lại trước khi Thêm điểm.';
              } else {
                document.getElementById('msgGpsMC').textContent = 'ℹ️ ' + kq.loi + ' — vẫn gõ tay Vĩ độ/Kinh độ bình thường.';
              }
            })
            .withFailureHandler(function () { document.getElementById('msgGpsMC').textContent = ''; })
            .DOC_TOA_DO_TU_ANH_WEBAPP(e.target.result.split(',')[1], file.type);
        };
        reader.readAsDataURL(file);
      });
      document.getElementById('btnThemGps').addEventListener('click', function () { themDiemGpsMC_(idRung); });
    }
    taiBangGPS_(idRung);
  }
  function taiBangGPS_(idRung) {
    hakRun_().withSuccessHandler(function (list) {
      var elBang = document.querySelector('.vung-bang-gps');
      elBang.innerHTML = !list.length ? '<div class="empty-hint">Chưa có điểm GPS nào.</div>' :
        ('<table class="mecon-table"><thead><tr><th>Điểm</th><th>Tọa độ</th><th>Ảnh</th></tr></thead><tbody>' +
          list.map(function (p, i) {
            return '<tr><td>Điểm ' + (i + 1) + '</td><td><a href="https://www.google.com/maps?q=' + p.lat + ',' + p.lng + '" target="_blank">' + p.lat.toFixed(6) + ', ' + p.lng.toFixed(6) + ' 🗺️</a></td>' +
              '<td>' + (p.hinhAnh ? '<a href="' + urlAnToan_(p.hinhAnh) + '" target="_blank">🖼️ xem</a>' : '—') + '</td></tr>';
          }).join('') + '</tbody></table>');
    }).withFailureHandler(function (err) { document.querySelector('.vung-bang-gps').innerHTML = '<div class="empty-hint">❌ Lỗi: ' + escHtml_(err.message) + '</div>'; }).layGPSCuaRung(idRung);
  }
  function themDiemGpsMC_(idRung) {
    var lat = document.getElementById('oGpsLat').value.trim(), lng = document.getElementById('oGpsLng').value.trim();
    if (!lat || !lng) { document.getElementById('msgGpsMC').textContent = '❌ Nhập đủ Vĩ độ và Kinh độ.'; return; }
    var fi = document.getElementById('oGpsAnh');
    document.getElementById('msgGpsMC').textContent = '⌛ Đang lưu...';
    function ghiDiem_(anhUrl) {
      hakRun_().withSuccessHandler(function (kq) {
        if (!kq.thanhCong) { document.getElementById('msgGpsMC').textContent = '❌ ' + kq.loi; return; }
        document.getElementById('oGpsLat').value = ''; document.getElementById('oGpsLng').value = ''; document.getElementById('tenAnhGps').textContent = '';
        document.getElementById('msgGpsMC').textContent = '✅ Đã thêm.';
        taiBangGPS_(idRung);
      }).withFailureHandler(function (err) { document.getElementById('msgGpsMC').textContent = '❌ Lỗi: ' + err.message; }).CAP_NHAT_GPS_RUNG(idRung, { lat: Number(lat), lng: Number(lng), anhUrl: anhUrl || '' }, false);
    }
    if (fi.files.length) {
      var reader = new FileReader();
      reader.onload = function (e) { hakRun_().withSuccessHandler(function (kq) { ghiDiem_(kq.thanhCong ? kq.url : ''); }).withFailureHandler(function () { ghiDiem_(''); }).TAI_ANH_GPS_LEN_DRIVE(e.target.result.split(',')[1], fi.files[0].type, fi.files[0].name); };
      reader.readAsDataURL(fi.files[0]);
    } else { ghiDiem_(''); }
  }

  function renderTabAnhRung_(idHD, idRung) {
    var el = document.getElementById('vungTabRung');
    var coTheSua = coTheSuaHopDong_(ctxRung.h.tinhTrang);
    el.innerHTML = '<div class="card-con"><div class="card-con-head"><div><h4>🖼️ Ảnh hiện trạng rừng &amp; khai thác</h4><p>Ảnh chụp THỰC TẾ cây/lô rừng (hiện trạng trước khi khai thác, quá trình khai thác...) — KHÁC với file hồ sơ pháp lý (giấy tờ) ở tab "Lô rừng" và ảnh có tọa độ ở tab "Tọa độ GPS".</p></div></div><div class="vung-bang-anh"><p class="hint">⌛ Đang tải...</p></div></div>' +
      (coTheSua ? '<div class="card-con" style="margin-top:12px">' +
      '<input type="file" id="oAnhRung" accept="image/*,application/pdf" style="display:none">' +
      '<button class="btn btn-outline" id="btnChonAnhRung" type="button" style="padding:5px 10px;font-size:11.5px">📁 Chọn ảnh/PDF...</button>' +
      '<span id="tenAnhRung" class="hint" style="margin-left:6px"></span>' +
      '<button class="btn btn-green" id="btnThemAnhRung" style="margin-top:8px;display:block;padding:6px 14px;font-size:12px">⬆️ Tải lên (tự duyệt)</button>' +
      '<div id="msgAnhMC" class="hint" style="margin-top:6px"></div></div>' : '<p class="hint">🔒 Hợp đồng đã "' + escHtml_(ctxRung.h.tinhTrang) + '" — chỉ xem, không tải ảnh mới được.</p>');
    if (coTheSua) {
      document.getElementById('btnChonAnhRung').addEventListener('click', function () { document.getElementById('oAnhRung').click(); });
      document.getElementById('oAnhRung').addEventListener('change', function () { document.getElementById('tenAnhRung').textContent = this.files[0] ? '✅ ' + this.files[0].name : ''; });
      document.getElementById('btnThemAnhRung').addEventListener('click', function () { themAnhRungMC_(idHD, idRung); });
    }
    taiBangAnhRung_(idHD, idRung);
  }
  function taiBangAnhRung_(idHD, idRung) {
    hakRun_().withSuccessHandler(function (list) {
      var daDuyet = (list || []).filter(function (a) { return a.trangThai === 'Đã duyệt'; });
      document.querySelector('.vung-bang-anh').innerHTML = !daDuyet.length ? '<div class="empty-hint">Chưa có ảnh nào cho lô này.</div>' :
        ('<table class="mecon-table"><thead><tr><th>Tên file</th><th>Nguồn</th><th>Xem</th></tr></thead><tbody>' +
          daDuyet.map(function (a) { return '<tr><td>' + escHtml_(a.tenFile) + '</td><td>' + (a.nguon === 'cu' ? '<span class="hint" title="' + escHtml_(a.ghiChu) + '">Ảnh cũ (chung hợp đồng)</span>' : 'Tải qua lô rừng này') + '</td><td><a href="' + urlAnToan_(a.url) + '" target="_blank">🖼️ xem</a></td></tr>'; }).join('') + '</tbody></table>');
    }).withFailureHandler(function (err) { document.querySelector('.vung-bang-anh').innerHTML = '<div class="empty-hint">❌ Lỗi: ' + escHtml_(err.message) + '</div>'; }).layDraftAnhChoRung(idRung, idHD);
  }
  function themAnhRungMC_(idHD, idRung) {
    var fi = document.getElementById('oAnhRung');
    if (!fi.files.length) { document.getElementById('msgAnhMC').textContent = '❌ Chọn file trước.'; return; }
    document.getElementById('msgAnhMC').textContent = '⌛ Đang tải lên...';
    var file = fi.files[0];
    var reader = new FileReader();
    reader.onload = function (e) {
      hakRun_()
        .withSuccessHandler(function (kq) {
          if (!kq.thanhCong) { document.getElementById('msgAnhMC').textContent = '❌ ' + kq.loi; return; }
          hakRun_().withSuccessHandler(function () {
            document.getElementById('msgAnhMC').textContent = '✅ Đã tải lên và duyệt.';
            fi.value = ''; document.getElementById('tenAnhRung').textContent = '';
            taiBangAnhRung_(idHD, idRung);
          }).withFailureHandler(function (err) { document.getElementById('msgAnhMC').textContent = '⚠️ Đã tải lên nhưng lỗi tự duyệt: ' + err.message; }).DUYET_ANH_RUNG(kq.soDongDraft, kq.idDraft);
        })
        .withFailureHandler(function (err) { document.getElementById('msgAnhMC').textContent = '❌ Lỗi: ' + err.message; })
        .THEM_ANH_RUNG({ idHD: idHD, idRung: idRung, base64Data: e.target.result.split(',')[1], mimeType: file.type, tenFileGoc: file.name });
    };
    reader.readAsDataURL(file);
  }

</script>
