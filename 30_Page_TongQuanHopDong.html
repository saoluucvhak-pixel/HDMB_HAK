<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
<style>

  :root {
    --sidebar-bg: #1f2937;
    --sidebar-bg-2: #2d3a4d;
    --active-green: #2563eb;
    --accent-gold: #b45309;
    --accent-purple: #1f2937;
    --text-light: #cbd5e1;
    --text-muted: #8b98ab;
    --card-bg: #ffffff;
    --page-bg: #f3f4f6;
    --border-light: #e5e7eb;
    --heading: #1f2937;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; display: flex; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--page-bg); color: var(--heading);
  }

  /* ---------- SIDEBAR ---------- */
  .app-sidebar {
    width: 250px; min-width: 250px; background: var(--sidebar-bg);
    color: var(--text-light); display: flex; flex-direction: column; padding: 18px 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 18px 20px 18px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent-gold);
    display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent-gold); font-size: 12px;
  }
  .brand .title { font-weight: bold; color: #fff; font-size: 15px; line-height: 1.2; }
  .brand .subtitle { font-size: 11px; color: var(--text-muted); }

  .nav-group-label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); padding: 14px 18px 4px 18px; letter-spacing: .05em; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: var(--text-light);
    text-decoration: none; font-size: 13px; cursor: pointer; border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.05); }
  .nav-item.active { background: var(--active-green); color: #fff; border-left-color: var(--accent-gold); font-weight: 600; }
  .nav-item .icon { width: 18px; text-align: center; }

  /* ---------- MAIN CONTENT ---------- */
  .app-main { flex: 1; padding: 26px 30px; overflow-y: auto; }
  .page-title { font-size: 22px; font-weight: 800; margin: 0 0 4px 0; color: var(--heading); }
  .page-subtitle { font-size: 13px; color: var(--chu-phu, #667); margin: 0 0 18px 0; }

  .tab-bar { display: flex; gap: 6px; border-bottom: 1px solid var(--border-light); margin-bottom: 18px; }
  .tab-bar a, .tab-bar span {
    padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--chu-phu, #667); text-decoration: none;
    border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px;
  }
  .tab-bar a.active { color: var(--active-green); border-bottom-color: var(--active-green); }

  .card {
    background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 10px;
    padding: 20px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card h3 { margin: 0 0 14px 0; font-size: 15px; }

  /* Modal "Xem chi tiết lô rừng" — nổi giữa màn hình, không phụ thuộc vị trí
     cuộn trang, vì bảng Hồ sơ rừng có thể rất dài (hàng trăm dòng) khiến card
     cũ (nằm ngay sau bảng, theo dòng chảy trang bình thường) bị đẩy xuống tít
     dưới, người dùng phải cuộn rất xa mới thấy. */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,35,27,0.55);
    z-index: 1000; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto;
  }
  .modal-overlay.mo { display: flex; }
  .modal-box {
    background: var(--card-bg); border-radius: 12px; padding: 22px 24px;
    max-width: 640px; width: 100%; max-height: calc(100vh - 80px); overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }

  .field-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 160px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--chu-phu, #445); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border-light); border-radius: 6px; font-size: 13px;
  }

  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border: none; border-radius: 7px;
    font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-green { background: var(--active-green); color: #fff; }
  .btn-gold { background: var(--accent-gold); color: #fff; }
  .btn-purple { background: var(--accent-purple); color: #fff; }
  .btn-outline { background: var(--nen-phu, #f3f4f6); color: var(--chu-chinh, #1f2937); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }

  .kpi-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .kpi-card {
    flex: 1; min-width: 200px; background: var(--card-bg); border: 1px solid var(--border-light);
    border-radius: 10px; padding: 18px 20px;
  }
  .kpi-card .label { font-size: 11px; font-weight: 700; color: var(--chu-phu, #889); letter-spacing: .03em; }
  .kpi-card .value { font-size: 26px; font-weight: 800; margin-top: 6px; color: var(--heading); }

  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; }
  .msg.ok { background: var(--ok-bg, #dcfce7); color: var(--ok-chu, #16a34a); border-left: 4px solid #16a34a; }
  .msg.err { background: var(--err-bg, #fee2e2); color: var(--err-chu, #dc2626); border-left: 4px solid #dc2626; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.data-table th { background: var(--sidebar-bg); color: #fff; padding: 8px; text-align: left; }
  table.data-table td { border-bottom: 1px solid var(--border-light); padding: 8px; }

  @media (max-width: 800px) {
    body { flex-direction: column; }
    .app-sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 10px; }
    .brand { display: none; }
    .nav-group-label { display: none; }
    .nav-item { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .nav-item.active { border-left: none; border-bottom-color: var(--accent-gold); }
  }
</style>
<style>
  .the-thongke-row { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .the-thongke { flex: 1; min-width: 140px; background: var(--card-bg, #fff); border-radius: 10px; padding: 16px 18px; border: 2px solid var(--border-light); cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .the-thongke:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .the-thongke.active { border-color: var(--active-green); background: var(--ok-bg, #dcfce7); }
  .the-thongke .so { font-size: 26px; font-weight: 700; color: var(--heading); }
  .the-thongke.active .so { color: var(--active-green); }
  .the-thongke .nhan { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  table.mecon-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.mecon-table th { background: var(--sidebar-bg); color: #fff; text-align: left; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
  table.mecon-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-light); }
  table.mecon-table tr:hover td { background: var(--ok-bg, #dcfce7); }
  a.lnk-hd { color: var(--active-green); font-weight: 600; cursor: pointer; text-decoration: none; }
  a.lnk-hd:hover { text-decoration: underline; }
  .badge-trang-thai { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; background: var(--ok-bg, #dcfce7); color: var(--active-green); }
  .empty-hint { text-align: center; padding: 24px; color: var(--text-muted); font-size: 12.5px; }
</style>

<div id="hakPhanQuyen" hidden data-phien="<?= typeof phien === 'undefined' ? '' : phien ?>" data-loi="<?= typeof loiDangNhap === 'undefined' ? '' : loiDangNhap ?>" data-trang="<?= typeof currentPage === 'undefined' ? '' : currentPage ?>" data-base="<?= typeof baseUrl === 'undefined' ? '' : baseUrl ?>"></div>
<?!= include_('PhanQuyen_JS') ?>
<?!= menuChung_(typeof currentPage === 'undefined' ? '' : currentPage, typeof baseUrl === 'undefined' ? '' : baseUrl, typeof tabTrang === 'undefined' ? '' : tabTrang) ?>

  <div class="app-main">
    <div class="page-title">Tổng quan hợp đồng</div>
    <div class="page-subtitle">Bấm nút tình trạng phía trên bảng để lọc danh sách. Số liệu ban đầu là TẤT CẢ — chọn bộ lọc rồi bấm "Lọc" để các chỉ số cập nhật theo.</div>

    <div class="card" style="margin-bottom:16px">
      <div class="field-row" style="align-items:flex-end">
        <div class="field"><label>Số hợp đồng</label><input id="locSoHD" placeholder="vd 20260710010"></div>
        <div class="field"><label>Họ tên chủ rừng</label><input id="locTenChuRung" placeholder="vd Nguyễn Văn A"></div>
        <div class="field"><label>Từ ngày ký</label><input id="locTuNgay" type="date"></div>
        <div class="field"><label>Đến ngày ký</label><input id="locDenNgay" type="date"></div>
        <div class="field" style="flex:none"><button class="btn btn-green" onclick="apDungBoLoc_(1)">🔍 Lọc</button></div>
        <div class="field" style="flex:none"><button class="btn btn-outline" onclick="xoaBoLoc_()">✕ Bỏ lọc</button></div>
      </div>
    </div>

    <div class="hak-kpi-row" id="vungKpiTien" aria-live="polite">
      <div class="hak-kpi"><div class="nhan">Đang tải...</div><div class="so">⌛</div></div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">
        <div class="hak-chips" id="vungTheThongKe" role="group" aria-label="Lọc theo tình trạng"></div>
        <div id="tieuDeDanhSach" style="font-size:13px;color:var(--chu-phu,#6b7280);margin-left:auto">Tất cả hợp đồng (mới ký trước)</div>
      </div>
      <div id="vungBangHD"><p class="hint">⌛ Đang tải...</p></div>
      <div id="phanTrangHD" style="margin-top:10px"></div>
    </div>
  </div>

<script>
  function escHtmlTQ_(s) { return (s === null || s === undefined ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); } // escape cả dấu nháy: giá trị có " trong value="..." không bị cắt cụt khi sửa rồi lưu
  function formatTienTQ_(v) { return Math.round(Number(v) || 0).toLocaleString('vi-VN'); }
  function formatSoTQ_(v) { return (Number(v) || 0).toLocaleString('vi-VN'); }
  var tinhTrangDangLoc_ = ''; // rỗng = Tất cả

  window.addEventListener('DOMContentLoaded', function () {
    hakNhoBoLoc_('tongquan', ['locSoHD', 'locTenChuRung']); // A4: nhớ ô lọc Số HĐ / tên chủ rừng
    // Điền sẵn khoảng ngày mặc định (Từ = đầu tháng hiện hành, Đến = hôm nay) để
    // người dùng chỉnh nhanh nếu muốn — nhưng KHÔNG tự áp dụng lọc ngay, số liệu
    // load ban đầu vẫn là TẤT CẢ (không giới hạn ngày) cho tới khi bấm "Lọc".
    var homNay = new Date();
    var dauThang = new Date(homNay.getFullYear(), homNay.getMonth(), 1);
    function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    document.getElementById('locTuNgay').value = ymd(dauThang);
    document.getElementById('locDenNgay').value = ymd(homNay);
    taiDashboard_(1); // load ban đầu = tất cả, KHÔNG đọc giá trị ô ngày ở trên
  });

  function layBoLocHienTai_(apDungNgay) {
    return {
      soHD: document.getElementById('locSoHD').value.trim(),
      tenChuRung: document.getElementById('locTenChuRung').value.trim(),
      tuNgay: apDungNgay ? document.getElementById('locTuNgay').value : '',
      denNgay: apDungNgay ? document.getElementById('locDenNgay').value : '',
      tinhTrangLoc: tinhTrangDangLoc_
    };
  }
  var boLocDaApDungNgay_ = false; // chỉ true sau khi người dùng bấm "Lọc" ít nhất 1 lần
  function apDungBoLoc_(trang) { boLocDaApDungNgay_ = true; taiDashboard_(trang || 1); }
  function xoaBoLoc_() {
    document.getElementById('locSoHD').value = ''; document.getElementById('locTenChuRung').value = '';
    boLocDaApDungNgay_ = false; tinhTrangDangLoc_ = '';
    // ⚠️ ĐÃ SỬA: trước đây chỉ đổi tiêu đề danh sách trong sự kiện click thẻ trạng thái
    // (renderTheThongKe_) — nếu người dùng bấm 1 thẻ trạng thái rồi bấm "Bỏ lọc", dữ liệu
    // bảng đã trở lại TẤT CẢ nhưng tiêu đề vẫn đứng yên ở tên trạng thái cũ, gây hiểu lầm.
    document.getElementById('tieuDeDanhSach').textContent = '📋 Tất cả hợp đồng (mới ký trước)';
    taiDashboard_(1);
  }

  function taiDashboard_(trang) {
    var boLoc = layBoLocHienTai_(boLocDaApDungNgay_);
    boLoc.trang = trang; boLoc.kichThuoc = 20;
    // Giữ số cũ, làm mờ trong lúc tải (không nháy trắng cả hàng chỉ số / nút lọc)
    ['vungKpiTien', 'vungTheThongKe'].forEach(function (id) { var el = document.getElementById(id); el.style.opacity = el.children.length ? '.55' : ''; });
    if (!document.getElementById('vungKpiTien').children.length) document.getElementById('vungKpiTien').innerHTML = '<div class="hak-kpi"><div class="nhan">Đang tải...</div><div class="so">⌛</div></div>';
    document.getElementById('vungBangHD').innerHTML = '<p class="hint">⌛ Đang tải...</p>';
    hakRun_()
      .withSuccessHandler(function (kq) {
        ['vungKpiTien', 'vungTheThongKe'].forEach(function (id) { document.getElementById(id).style.opacity = ''; });
        renderKpiTien_(kq);
        renderTheThongKe_(kq);
        renderBangHD_(kq);
      })
      .withFailureHandler(function (err) {
        document.getElementById('vungKpiTien').innerHTML = '<div class="empty-hint">❌ Lỗi: ' + escHtmlTQ_(err.message) + '</div>';
        document.getElementById('vungTheThongKe').innerHTML = '';
        document.getElementById('vungBangHD').innerHTML = '';
      })
      .LAY_TONG_QUAN_HOP_DONG(boLoc);
  }

  // Giao diện mới: 4 chỉ số (số HĐ, giá trị, khối lượng đã thực hiện / dự kiến, giá trị đã thực hiện) + thanh tiến độ
  function phanTramTQ_(a, b) { a = Number(a) || 0; b = Number(b) || 0; return b > 0 ? Math.min(100, Math.round(a / b * 100)) : 0; }
  function renderKpiTien_(kq) {
    var el = document.getElementById('vungKpiTien'); el.innerHTML = '';
    var ptKL = phanTramTQ_(kq.tongKhoiLuongThucHien, kq.tongKhoiLuongDuKien), ptGT = phanTramTQ_(kq.tongGiaTriThucHien, kq.tongGiaTriHopDong);
    [
      { nhan: 'Số hợp đồng', mau: '#1f2937', so: formatSoTQ_(kq.tongSo), donVi: 'HĐ', phu: tinhTrangDangLoc_ ? 'Tình trạng: ' + tinhTrangDangLoc_ : 'Theo bộ lọc đang chọn' },
      { nhan: 'Giá trị hợp đồng', mau: '#2563eb', so: formatTienTQ_(kq.tongGiaTriHopDong), donVi: 'đ', phu: 'Tổng giá trị ký kết' },
      { nhan: 'Khối lượng đã thực hiện', mau: '#16a34a', so: formatSoTQ_(kq.tongKhoiLuongThucHien), donVi: 'tấn', phu: kq.tongKhoiLuongDuKien ? ptKL + '% của ' + formatSoTQ_(kq.tongKhoiLuongDuKien) + ' tấn dự kiến' : 'Chưa có khối lượng dự kiến', pt: kq.tongKhoiLuongDuKien ? ptKL : null },
      { nhan: 'Giá trị đã thực hiện', mau: '#b45309', so: formatTienTQ_(kq.tongGiaTriThucHien), donVi: 'đ', phu: kq.tongGiaTriHopDong ? ptGT + '% giá trị hợp đồng' : '', pt: kq.tongGiaTriHopDong ? ptGT : null }
    ].forEach(function (t) {
      var div = document.createElement('div'); div.className = 'hak-kpi';
      div.innerHTML = '<div class="nhan"><i style="background:' + t.mau + '"></i>' + escHtmlTQ_(t.nhan) + '</div>' +
        '<div class="so">' + escHtmlTQ_(t.so) + '<small>' + escHtmlTQ_(t.donVi) + '</small></div>' +
        (t.pt !== null && t.pt !== undefined ? '<div class="hak-thanh" role="img" aria-label="' + t.pt + '%"><span style="width:' + t.pt + '%;background:' + t.mau + '"></span></div>' : '') +
        '<div class="phu">' + escHtmlTQ_(t.phu) + '</div>';
      el.appendChild(div);
    });
  }

  function renderTheThongKe_(kq) {
    var elThe = document.getElementById('vungTheThongKe');
    var dsThe = [{ ma: '', nhan: 'Tất cả', so: kq.tongSoHopDong }].concat(
      ['Chờ thực hiện', 'Đang thực hiện', 'Đã hoàn thành', 'Đã hủy', 'Đã thanh lý'].map(function (tt) {
        return { ma: tt, nhan: tt, so: kq.theoTrangThai[tt] || 0 };
      })
    );
    elThe.innerHTML = '';
    dsThe.forEach(function (t) {
      var nut = document.createElement('button');
      nut.type = 'button';
      nut.setAttribute('aria-pressed', t.ma === tinhTrangDangLoc_ ? 'true' : 'false');
      nut.innerHTML = escHtmlTQ_(t.nhan) + ' <span class="dem">' + escHtmlTQ_(t.so) + '</span>';
      nut.addEventListener('click', function () {
        tinhTrangDangLoc_ = t.ma;
        document.getElementById('tieuDeDanhSach').textContent = (t.ma ? 'Hợp đồng "' + t.ma + '"' : 'Tất cả hợp đồng') + ' (mới ký trước)';
        taiDashboard_(1);
      });
      elThe.appendChild(nut);
    });
  }

  function renderBangHD_(kq) {
    var elBang = document.getElementById('vungBangHD');
    if (!kq.items || !kq.items.length) { elBang.innerHTML = '<div class="empty-hint">Không có hợp đồng nào khớp bộ lọc.</div>'; document.getElementById('phanTrangHD').innerHTML = ''; return; }
    var table = document.createElement('table'); table.className = 'mecon-table';
    table.innerHTML = '<thead><tr><th>Số HĐ</th><th>Chủ rừng</th><th>Ngày ký</th><th class="so">KL dự kiến (tấn)</th><th>Đã thực hiện</th><th class="so">Giá trị (đ)</th><th>Tình trạng</th><th></th></tr></thead>';
    var tbody = document.createElement('tbody');
    kq.items.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td><a class="lnk-hd">' + escHtmlTQ_(r.soHD) + '</a></td><td>' + escHtmlTQ_(r.tenChuRung) + '</td>' +
        '<td>' + (r.ngayKy ? new Date(r.ngayKy).toLocaleDateString('vi-VN') : '') + '</td>' +
        '<td class="so">' + formatSoTQ_(r.khoiLuongDuKien || 0) + '</td>' +
        '<td>' + (r.khoiLuongDuKien ? (function (pt) { var mau = pt >= 100 ? '#16a34a' : pt > 0 ? '#2563eb' : '#9ca3af'; return '<div class="hak-tien-do"><div class="hak-thanh"><span style="width:' + pt + '%;background:' + mau + '"></span></div><b>' + pt + '%</b></div>'; })(phanTramTQ_(r.khoiLuongThucHien, r.khoiLuongDuKien)) : '<span style="color:var(--chu-phu,#9ca3af)">—</span>') + '</td>' +
        '<td class="so">' + formatTienTQ_(r.giaTriHopDong || 0) + '</td>' +
        '<td><span class="badge-trang-thai">' + escHtmlTQ_(r.tinhTrang) + '</span></td><td></td>';
      tr.querySelector('a').addEventListener('click', function () { moHopDong_(r.idHD); });
      var tdNut = tr.lastElementChild;
      var lnkXem = document.createElement('a'); lnkXem.className = 'lnk-hd'; lnkXem.style.fontWeight = '400'; lnkXem.textContent = 'Xem/Sửa →';
      lnkXem.addEventListener('click', function () { moHopDong_(r.idHD); });
      tdNut.appendChild(lnkXem);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody); elBang.innerHTML = ''; elBang.appendChild(table);

    var elTrang = document.getElementById('phanTrangHD'); elTrang.innerHTML = '';
    var bT = document.createElement('button'); bT.className = 'btn btn-outline'; bT.textContent = '‹ Trước'; bT.disabled = kq.trang <= 1;
    bT.addEventListener('click', function () { taiDashboard_(kq.trang - 1); });
    var sp = document.createElement('span'); sp.style.margin = '0 10px'; sp.style.fontSize = '13px'; sp.style.color = 'var(--chu-phu,#6b7280)'; sp.textContent = 'Trang ' + kq.trang + '/' + kq.tongTrang + ' (' + kq.tongSo + ' hợp đồng)';
