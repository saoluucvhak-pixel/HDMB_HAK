<!-- Mã JavaScript DÙNG CHUNG cho 07_Form_HopDong.html và 11_Page_NhapLieu.html (nạp bằng include('NhapLieu_Chung_JS') trong scriptlet).
     Sửa ở đây là áp dụng cho cả hai trang — trước đây mỗi trang giữ 1 bản sao và từng bị lệch nhau
     (bản vá chỉ vào 1 bên), gây lỗi thật. Chỉ đặt hàm ở đây; biến trạng thái vẫn khai báo trong từng trang. -->
<script>
  // Ô nhập số hiển thị kiểu Việt Nam "1.234.567,5" (DinhDangSo_JS.html, nạp trước file này).
  // val() của các ô này trả SỐ THÔ kiểu JS ("1234567.5") và setVal() tự định dạng — nên mọi
  // chỗ đang dùng Number(val(...)) / gửi val(...) lên máy chủ vẫn đúng, không phải sửa từng nơi.
  var O_NHAP_SO_ = ['rDienTich', 'rDonGia', 'rKhoiLuong', 'plDonGia', 'plKhoiLuong'];
  function val(id) {
    var v = document.getElementById(id).value;
    if (O_NHAP_SO_.indexOf(id) === -1) return v;
    var n = docSoVN_(v);
    return isNaN(n) ? '' : String(n);
  }

  // Thông báo nổi KHÔNG chặn thao tác (thay cho alert()): tự tắt sau vài giây, bấm để đóng,
  // màu theo tiền tố ❌ / ⚠️ / ✅ sẵn có của nội dung, trình đọc màn hình đọc được (aria-live).
  function thongBao_(noiDung) {
    var s = String(noiDung === null || noiDung === undefined ? '' : noiDung);
    var loai = /^❌/.test(s) ? 'loi' : /^⚠️/.test(s) ? 'canhbao' : /^✅/.test(s) ? 'ok' : 'tin';
    var hop = document.getElementById('hakToastHop');
    if (!hop) {
      hop = document.createElement('div'); hop.id = 'hakToastHop';
      hop.setAttribute('role', 'status'); hop.setAttribute('aria-live', 'polite');
      hop.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:100000;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 24px))';
      document.body.appendChild(hop);
    }
    var o = document.createElement('div');
    o.textContent = s; o.title = 'Bấm để đóng'; o.className = 'hak-toast hak-toast-' + loai;
    o.style.cssText = 'background:' + { loi: '#dc2626', canhbao: '#b45309', ok: '#16a34a', tin: '#1f2937' }[loai] +
      ';color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:13px;line-height:1.45;white-space:pre-line;word-break:break-word;cursor:pointer';
    o.onclick = function () { if (o.parentNode) o.parentNode.removeChild(o); };
    hop.appendChild(o);
    setTimeout(function () { if (o.parentNode) o.parentNode.removeChild(o); }, loai === 'loi' ? 12000 : 6000);
  }

  // Escape đầy đủ (kể cả dấu nháy) + chỉ cho link http(s) — tên file/đường link do người dùng tải lên
  // được chèn vào innerHTML; thiếu escape thì tên file chứa <img onerror=...> hay link javascript: sẽ chạy mã.
  function escAT_(s) { return (s === null || s === undefined ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

  function urlAT_(u) { u = (u || '').toString().trim(); return /^https?:\/\//i.test(u) ? escAT_(u) : '#'; }

  function setVal(id, v) { document.getElementById(id).value = O_NHAP_SO_.indexOf(id) === -1 ? (v || '') : dinhDangSoVN_(v || ''); }
  O_NHAP_SO_.forEach(function (id) { ganDinhDangSo_(id); });

  function formatSoNhap_(v) { var n = Number(v); if (!v || isNaN(n)) return '0'; return n.toLocaleString('vi-VN'); }

  function showMsg(id, text, ok) { var el = document.getElementById(id); el.style.display = 'block'; el.className = 'msg ' + (ok ? 'ok' : 'err'); el.textContent = text; }

  function taoTempId_() { return 'tmp' + (++demTempId) + '_' + Date.now(); }

  // ============ BREADCRUMB & ĐIỀU HƯỚNG ============
  function renderBreadcrumb(items) {
    document.getElementById('breadcrumbBar').innerHTML = items.map(function (it, i) {
      var isLast = (i === items.length - 1);
      if (isLast || !it.onClick) return '<span class="current">' + escAT_(it.label) + '</span>';
      return '<a onclick="(' + escAT_(it.onClick) + ')()">' + escAT_(it.label) + '</a>';
    }).join('<span class="sep">/</span>');
  }

  function hienTrang(id) {
    ['trangDanhSach', 'trangHopDong', 'trangRung'].forEach(function (t) { document.getElementById(t).style.display = (t === id) ? 'block' : 'none'; });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function toggleUyQuyen() {
    var co = val('uyQuyenTT') === 'Có';
    document.getElementById('fUyQuyenTen').style.display = co ? 'block' : 'none';
    document.getElementById('fUyQuyenCCCD').style.display = co ? 'block' : 'none';
    document.getElementById('khoUyQuyenThem').style.display = co ? 'flex' : 'none';
    document.getElementById('khoUyQuyenThem2').style.display = co ? 'flex' : 'none';
  }

  function toggleUyQuyenTK() { document.getElementById('khoTenUyQuyenTK').style.display = (val('tUyQuyenTT') === 'Có') ? 'flex' : 'none'; }

  function debounceLuuNhap() { clearTimeout(timeoutLuuNhap); timeoutLuuNhap = setTimeout(function () { capNhatDuNhapTuFormHopDong_(); luuNhapNgay(); }, 700); }

  function luuNhapNgay() {
    if (!idDraftHienTai) return;
    hakRun_().withFailureHandler(function (err) { console.error('Lỗi lưu nháp: ', err); }).LUU_DRAFT(idDraftHienTai, JSON.stringify(duNhap));
    renderChiTietXemTruoc();
  }

  function goiYDiaChiTheoTen() {
    var ten = val('tenChuRung');
    if (!ten || duNhap.idHD) return;
    hakRun_().withSuccessHandler(function (kq) { if (kq && !val('diaChiThuongTru')) { setVal('diaChiThuongTru', kq.diaChiThuongTru); debounceLuuNhap(); } }).withFailureHandler(function (err) { console.error('goiYDiaChiTheoTen:', err); }).traCuuDiaChiThamChieu(ten);
  }

  function naptDanhSachDiaChi() {
    hakRun_().withSuccessHandler(function (list) {
      var dl = document.getElementById('dlDiaChi'); dl.innerHTML = '';
      list.forEach(function (dc) { var opt = document.createElement('option'); opt.value = dc; dl.appendChild(opt); });
    }).withFailureHandler(function (err) { console.error('naptDanhSachDiaChi:', err); }).layGoiYDiaChi();
  }

  function naptDanhSachLoaiHoSo(giuLaiGiaTri) {
    hakRun_().withSuccessHandler(function (list) {
      var sel = document.getElementById('rHoSoNguonGoc');
      var giaTriCu = giuLaiGiaTri || sel.value;
      sel.innerHTML = '<option value="">-- Chọn --</option>';
      list.forEach(function (loai) { var opt = document.createElement('option'); opt.value = loai; opt.textContent = loai; sel.appendChild(opt); });
      var optKhac = document.createElement('option'); optKhac.value = '__KHAC__'; optKhac.textContent = '+ Thêm loại khác...';
      sel.appendChild(optKhac);
      if (giaTriCu && giaTriCu !== '__KHAC__') sel.value = giaTriCu;
    }).withFailureHandler(function (err) { console.error('naptDanhSachLoaiHoSo:', err); }).layDanhSachLoaiHoSo();
  }

  function xemGoiYDonGiaBaoGia() {
    var ngayKy = val('ngayKy');
    if (!ngayKy) { thongBao_('Vui lòng nhập Ngày ký hợp đồng trước.'); return; }
    document.getElementById('goiYDonGiaText').innerHTML = '⌛ Đang tra...';
    hakRun_()
      .withSuccessHandler(function (kq) {
        if (!kq.thanhCong) { document.getElementById('goiYDonGiaText').textContent = '❌ ' + kq.loi; return; }
        var donGiaLamTron = Math.round(kq.donGiaBinhQuan / 1000) * 1000;
        document.getElementById('goiYDonGiaText').innerHTML = '💰 Đơn giá bình quân: <b>' + donGiaLamTron.toLocaleString('vi-VN') + ' đ</b> (từ ' + escAT_(kq.soDongDuLieu) + ' dòng)';
      })
      .withFailureHandler(function (err) { document.getElementById('goiYDonGiaText').textContent = '❌ Lỗi: ' + err.message; })
      .layDonGiaBinhQuanThang(ngayKy);
  }

  // ============ CHI TIẾT HỢP ĐỒNG — TÍNH XEM TRƯỚC TỪ NHÁP (client-side, chưa chính thức) ============
  function renderChiTietXemTruoc() {
    var dsConLai = (duNhap.rung || []).filter(function (r) { return !r.xoa; });
    if (!dsConLai.length) { document.getElementById('cardCtHopDong').style.display = 'none'; return; }
    document.getElementById('cardCtHopDong').style.display = 'block';
    document.getElementById('ctHint').textContent = '(xem trước từ nháp — chưa lưu chính thức)';
    var tongDT = 0, tongKL = 0, tongGT = 0, tongDG = 0, soCoGia = 0;
    var diaChiSet = [], soGiayToSet = [], hoSoSet = [];
    dsConLai.forEach(function (r) {
      tongDT += Number(r.dienTichM2) || 0; tongKL += Number(r.khoiLuongDuKien) || 0;
      var dg = Number(r.donGia) || 0; tongGT += (Number(r.khoiLuongDuKien) || 0) * dg;
      if (dg > 0) { tongDG += dg; soCoGia++; }
      if (r.diaChiRung && diaChiSet.indexOf(r.diaChiRung) === -1) diaChiSet.push(r.diaChiRung);
      if (r.soGiayTo && soGiayToSet.indexOf(r.soGiayTo) === -1) soGiayToSet.push(r.soGiayTo);
      if (r.hoSoNguonGoc && hoSoSet.indexOf(r.hoSoNguonGoc) === -1) hoSoSet.push(r.hoSoNguonGoc);
    });
    var donGiaBQ = soCoGia ? Math.round(tongDG / soCoGia) : 0;
    document.getElementById('ctGrid').innerHTML = [
      ['Diện tích ký HĐ', formatSoNhap_(tongDT) + ' m²'], ['Đơn giá (bình quân)', formatSoNhap_(donGiaBQ) + ' đ/tấn'],
      ['Khối lượng dự kiến', formatSoNhap_(tongKL) + ' tấn'], ['Giá trị dự kiến', formatSoNhap_(tongGT) + ' đ'],
      ['Số lô rừng', dsConLai.length], ['Loại hồ sơ nguồn gốc', hoSoSet.join(', ') || '—'],
      ['Số giấy tờ', soGiayToSet.join(', ') || '—'], ['Địa chỉ rừng', diaChiSet.join(', ') || '—']
    ].map(function (kv) { return '<div class="ct-item"><div class="lbl">' + kv[0] + '</div><div class="val">' + kv[1] + '</div></div>'; }).join('');
  }

  // ============ TAB BẬC 1: Lô rừng / Tài khoản / Phụ lục ============
  function chonTabHD(tab) {
    tabHDHienTai = tab;
    document.getElementById('tabNoiDungRung').style.display = (tab === 'rung') ? 'block' : 'none';
    document.getElementById('tabNoiDungTK').style.display = (tab === 'taikhoan') ? 'block' : 'none';
    document.getElementById('tabNoiDungPL').style.display = (tab === 'phuluc') ? 'block' : 'none';
    document.getElementById('tabBtnRung').classList.toggle('active', tab === 'rung');
    document.getElementById('tabBtnTK').classList.toggle('active', tab === 'taikhoan');
    document.getElementById('tabBtnPL').classList.toggle('active', tab === 'phuluc');
  }

  function capNhatDemHD() {
    document.getElementById('demRung').textContent = (duNhap.rung || []).filter(function (r) { return !r.xoa; }).length;
    document.getElementById('demTK').textContent = (duNhap.taiKhoan || []).filter(function (t) { return !t.xoa; }).length;
    document.getElementById('demPL').textContent = (duNhap.phuLuc || []).filter(function (p) { return !p.xoa; }).length;
  }

  // ============ DANH SÁCH / TÌM / PHÂN TRANG HỢP ĐỒNG ============
  function debounceTimKiemHD() { clearTimeout(timeoutTimKiemHD); timeoutTimKiemHD = setTimeout(function () { taiDanhSachHD(1); }, 300); }

  function taiDanhSachHD(trang) {
    hakRun_()
      .withFailureHandler(function (err) { document.querySelector('#tblDSHopDong tbody').innerHTML = '<tr><td colspan="6" style="color:red">❌ Lỗi: ' + escAT_(err.message) + '</td></tr>'; })
      .withSuccessHandler(function (kq) {
        try {
          if (kq && kq.loi) { document.querySelector('#tblDSHopDong tbody').innerHTML = '<tr><td colspan="6" style="color:red">❌ ' + escAT_(kq.loi) + '</td></tr>'; return; }
          trangHDHienTai = kq.trang;
          var tbody = document.querySelector('#tblDSHopDong tbody'); tbody.innerHTML = '';
          if (!kq.items.length) tbody.innerHTML = '<tr><td colspan="6" class="hint" style="text-align:center">Không có hợp đồng nào khớp.</td></tr>';
          kq.items.forEach(function (r) {
            var badge = r.tinhTrang === 'Đã hủy' ? 'badge-huy' : (r.tinhTrang === 'Đã hoàn thành' ? 'badge-hoan' : 'badge-dang');
            var tr = document.createElement('tr'); tr.style.cursor = 'pointer'; tr.onclick = function () { moTrangXemHopDong(r.soDong); };
            tr.innerHTML = '<td>' + escAT_(r.soHD || '') + '</td><td>' + (r.ngayKy ? new Date(r.ngayKy).toLocaleDateString('vi-VN') : '') + '</td>' +
              '<td>' + escAT_(r.tenChuRung || '') + '</td><td>' + escAT_(r.diaChiRung || '') + '</td>' +
              '<td><span class="badge-status ' + badge + '">' + escAT_(r.tinhTrang || '') + '</span></td>' +
              '<td><button class="btn btn-outline" style="padding:4px 10px;font-size:11px" onclick="event.stopPropagation();moTrangXemHopDong(' + escAT_(r.soDong) + ')">Xem →</button></td>';
            tbody.appendChild(tr);
          });
          var pgEl = document.getElementById('phanTrangHD');
          pgEl.innerHTML = '<button class="pagination-btn" ' + (kq.trang <= 1 ? 'disabled' : '') + ' onclick="taiDanhSachHD(' + (kq.trang - 1) + ')">‹ Trước</button>' +
            '<span>Trang ' + escAT_(kq.trang) + ' / ' + escAT_(kq.tongTrang) + ' (' + escAT_(kq.tongSo) + ' hợp đồng)</span>' +
            '<button class="pagination-btn" ' + (kq.trang >= kq.tongTrang ? 'disabled' : '') + ' onclick="taiDanhSachHD(' + (kq.trang + 1) + ')">Sau ›</button>';
        } catch (exLoi) { document.querySelector('#tblDSHopDong tbody').innerHTML = '<tr><td colspan="6" style="color:red">❌ Lỗi hiển thị: ' + escAT_(exLoi.message) + '</td></tr>'; }
      }).layDanhSachHopDong(trang || 1, 20, val('tuKhoaHD'), val('locTinhTrangHD'));
  }

  function veTrangDanhSach() { hienTrang('trangDanhSach'); renderBreadcrumb([{ label: '📋 Hợp đồng' }]); taiDanhSachHD(trangHDHienTai || 1); }

  /** Bấm 1 dòng trong danh sách -> mở/tạo NHÁP cho hợp đồng đó (không đụng bảng gốc cho tới khi Lưu chính thức) */
  function moTrangXemHopDong(soDong) {
    hienTrang('trangHopDong');
    renderBreadcrumb([{ label: '📋 Hợp đồng', onClick: 'veTrangDanhSach' }, { label: '⌛ Đang mở nháp...' }]);
    hakRun_()
      .withFailureHandler(function (err) { thongBao_('❌ Lỗi mở nháp: ' + err.message); veTrangDanhSach(); })
      .withSuccessHandler(function (kq) {
        if (!kq) { thongBao_('❌ Không tìm thấy hợp đồng.'); veTrangDanhSach(); return; }
        idDraftHienTai = kq.idDraft; duNhap = kq.du; tinhTrangGocDangSua = kq.tinhTrangGoc;
        soHDHienTai = duNhap.hopDong.soHD; tenChuRungHienTai = duNhap.hopDong.tenChuRung;
        napFormTuDuNhap_();
        document.getElementById('khoNguyHiem').style.display = 'block';
        apDungCheDoChiXem(kq.tinhTrangGoc === 'Đã thanh lý');
        capNhatBreadcrumbHopDong();
      })
      .MO_DRAFT_THEO_SO_DONG(soDong);
  }

  function capNhatBreadcrumbHopDong() {
    renderBreadcrumb([{ label: '📋 Hợp đồng', onClick: 'veTrangDanhSach' }, { label: (tenChuRungHienTai || duNhap.hopDong.tenChuRung || '(chưa đặt tên)') }]);
  }

  function apDungCheDoChiXem(chiXem) {
    document.getElementById('bannerChiXem').style.display = chiXem ? 'block' : 'none';
    document.querySelectorAll('.khoa-khi-thanh-ly input, .khoa-khi-thanh-ly select, .khoa-khi-thanh-ly button').forEach(function (el) { el.disabled = chiXem; });
    document.getElementById('khoNguyHiem').style.display = chiXem ? 'none' : 'block';
  }

  function luuChinhThuc() {
    capNhatDuNhapTuFormHopDong_();
    if (!duNhap.hopDong.tenChuRung || !duNhap.hopDong.cccdChuRung || !duNhap.hopDong.ngayKy) {
      showMsg('msgLuuChinhThuc', '❌ Vui lòng điền Họ tên / CCCD / Ngày ký (bắt buộc).', false); return;
    }
    if (dangLuuChinhThuc_) return; // chặn bấm 2 lần (server cũng tự chặn — xem LUU_CHINH_THUC)
    dangLuuChinhThuc_ = true;
    showMsg('msgLuuChinhThuc', '⌛ Đang lưu chính thức vào hệ thống...', true);
    hakRun_()
      .withFailureHandler(function (err) {
        dangLuuChinhThuc_ = false;
        // Máy chủ đã ghi tiến độ vào bản nháp (15_DraftHopDong.gs) -> lưu lại chỉ làm nốt phần còn thiếu, không tạo trùng
        showMsg('msgLuuChinhThuc', '❌ Lỗi: ' + err.message + ' — Phần đã lưu được giữ lại; bấm "Lưu chính thức" lần nữa để hoàn tất (không tạo hợp đồng trùng).', false);
      })
      .withSuccessHandler(function (kq) {
        dangLuuChinhThuc_ = false;
        if (!kq.thanhCong) { showMsg('msgLuuChinhThuc', '❌ ' + kq.loi, false); return; }
        var thongBao = '✅ Đã lưu chính thức hợp đồng ' + kq.soHD + ' vào hệ thống.';
        if (kq.canhBao && kq.canhBao.length) thongBao += '\n\n⚠️ Một số mục gặp lỗi khi ghi:\n• ' + kq.canhBao.join('\n• ');
        thongBao_(thongBao);
        veTrangDanhSach();
      })
      .LUU_CHINH_THUC(idDraftHienTai);
  }

  function huyNhapVaThoat() {
    if (!confirm('Hủy toàn bộ thay đổi trong bản nháp này? (dữ liệu chính thức hiện có, nếu là hợp đồng cũ, sẽ KHÔNG bị ảnh hưởng)')) return;
    hakRun_().withFailureHandler(function (err) { thongBao_('❌ Lỗi: ' + err.message); }).withSuccessHandler(function () { veTrangDanhSach(); }).HUY_DRAFT(idDraftHienTai);
  }

  // ============ TAB: LÔ RỪNG — thao tác trên duNhap.rung[], không đụng HD_RUNG cho tới khi Lưu chính thức ============
  function tuTinhKLRung() { var dt = Number(val('rDienTich')) || 0; setVal('rKhoiLuong', Math.round((DINH_MUC_TAN_TREN_HA_JS * dt / 10000) * 100) / 100); }

  function renderTomTatRung() {
    var el = document.getElementById('dsRungTomTat');
    var ds = (duNhap.rung || []).filter(function (r) { return !r.xoa; });
    if (!ds.length) { el.innerHTML = '<p class="hint">Chưa có lô rừng nào.</p>'; return; }
    el.innerHTML = ds.map(function (r) {
      var key = r.idRung || r.tempId;
      var laNhap = !r.idRung;
      return '<div class="row-card' + (laNhap ? ' la-nhap' : '') + '" onclick="moTrangXemRung(\'' + key + '\')">' +
        '<div><b>' + escAT_(r.idRung || '(chưa lưu chính thức)') + '</b>' + (laNhap ? '<span class="tag-nhap">NHÁP</span>' : '') + ' — ' + escAT_(r.diaChiRung || '') + '<br>' +
        '<span class="hint">DT: ' + formatSoNhap_(r.dienTichM2) + ' m² · Đơn giá: ' + formatSoNhap_(r.donGia) + ' đ/tấn · KL: ' + formatSoNhap_(r.khoiLuongDuKien) + ' tấn</span></div>' +
        '<span class="hint">Xem →</span></div>';
    }).join('');
  }

  function timRungTrongNhap_(key) {
    return (duNhap.rung || []).find(function (r) { return r.idRung === key || r.tempId === key; });
  }

  function moTrangTaoRung() {
    rungDangSuaKey = null; rungDangSuaLaThat = false;
    document.getElementById('tieuDeTrangRung').textContent = '➕ Thêm lô rừng mới (nháp)';
    ['rDiaChi', 'rDienTich', 'rDonGia', 'rKhoiLuong', 'rSoGiayTo'].forEach(function (id) { setVal(id, ''); });
    naptDanhSachLoaiHoSo();
    apDungKhoaFileRung_(false);
    document.querySelector('#trangRung .card:last-child').style.display = 'none';
    document.getElementById('khuVucTabsRung').style.display = 'none';
    hienTrang('trangRung');
    renderBreadcrumb([{ label: '📋 Hợp đồng', onClick: 'veTrangDanhSach' }, { label: tenChuRungHienTai, onClick: 'quayVeTrangHopDong' }, { label: '➕ Thêm lô rừng (nháp)' }]);
  }

  function moTrangXemRung(key) {
    rungDangSuaKey = key;
    var r = timRungTrongNhap_(key);
    if (!r) { quayVeTrangHopDong(); return; }
    rungDangSuaLaThat = !!r.idRung;
    document.getElementById('tieuDeTrangRung').textContent = (rungDangSuaLaThat ? '✏️ Lô rừng ' + r.idRung : '✏️ Lô rừng (nháp, chưa lưu chính thức)');
    naptDanhSachLoaiHoSo(r.hoSoNguonGoc);
    setVal('rDiaChi', r.diaChiRung); setVal('rDienTich', r.dienTichM2); setVal('rDonGia', r.donGia); setVal('rKhoiLuong', r.khoiLuongDuKien); setVal('rSoGiayTo', r.soGiayTo);
    apDungKhoaFileRung_(rungDangSuaLaThat);
    document.querySelector('#trangRung .card:last-child').style.display = 'block';
    document.getElementById('khuVucTabsRung').style.display = 'block';
    chonTabRung('gps');
    renderDsGPS_();
    if (rungDangSuaLaThat) { taiDsHoSoRungThat(r.idRung); taiDsAnh(r.idRung); }
    else {
      document.getElementById('dsHoSoRung').innerHTML = '';
      document.getElementById('dsAnh').innerHTML = '<p class="hint">Chỉ khả dụng sau khi Lưu chính thức.</p>';
      document.getElementById('dsAnhChungHopDong').innerHTML = '';
    }
    hienTrang('trangRung');
    renderBreadcrumb([{ label: '📋 Hợp đồng', onClick: 'veTrangDanhSach' }, { label: tenChuRungHienTai, onClick: 'quayVeTrangHopDong' }, { label: r.idRung || 'Lô rừng nháp' }]);
  }

  function apDungKhoaFileRung_(moKhoa) {
    document.getElementById('cardCanhBaoChuaThat').style.display = moKhoa ? 'none' : 'block';
    document.getElementById('cardHoSoRung').style.display = moKhoa ? 'block' : 'none';
  }

  function quayVeTrangHopDong() { hienTrang('trangHopDong'); capNhatBreadcrumbHopDong(); renderTomTatRung(); }

  /** Lưu lô rừng VÀO NHÁP (không ghi HD_RUNG) */
  function luuLoRungVaoNhap() {
    var hoSoChon = val('rHoSoNguonGoc');
    if (hoSoChon === '__KHAC__') {
      var loaiMoi = prompt('Nhập tên loại hồ sơ mới:');
      if (!loaiMoi) { document.getElementById('rHoSoNguonGoc').value = ''; return; }
      hakRun_().withSuccessHandler(function () { naptDanhSachLoaiHoSo(); document.getElementById('rHoSoNguonGoc').value = loaiMoi; luuLoRungVaoNhapThucHien_(loaiMoi); }).withFailureHandler(function (err) { thongBao_('❌ Lỗi thêm loại hồ sơ: ' + err.message); }).themLoaiHoSoMoi(loaiMoi);
      return;
    }
    luuLoRungVaoNhapThucHien_(hoSoChon);
  }

  function luuLoRungVaoNhapThucHien_(hoSoNguonGoc) {
    var d = { diaChiRung: val('rDiaChi'), dienTichM2: val('rDienTich'), donGia: val('rDonGia'), khoiLuongDuKien: val('rKhoiLuong'), hoSoNguonGoc: hoSoNguonGoc, soGiayTo: val('rSoGiayTo'), xoa: false };
    if (!duNhap.rung) duNhap.rung = [];
    var existing = rungDangSuaKey ? timRungTrongNhap_(rungDangSuaKey) : null;
    if (existing) {
      Object.assign(existing, d);
    } else {
      var tempId = taoTempId_();
      d.idRung = null; d.tempId = tempId; d.gpsMoi = [];
      duNhap.rung.push(d);
      rungDangSuaKey = tempId; rungDangSuaLaThat = false;
      document.getElementById('tieuDeTrangRung').textContent = '✏️ Lô rừng (nháp, chưa lưu chính thức)';
      apDungKhoaFileRung_(false);
      document.querySelector('#trangRung .card:last-child').style.display = 'block';
      document.getElementById('khuVucTabsRung').style.display = 'block';
      chonTabRung('gps'); renderDsGPS_();
      document.getElementById('dsAnh').innerHTML = '<p class="hint">Chỉ khả dụng sau khi Lưu chính thức.</p>';
      document.getElementById('dsAnhChungHopDong').innerHTML = '';
    }
    luuNhapNgay();
    showMsg('msgFormRung', '✅ Đã lưu vào nháp.', true);
  }

  function xoaLoRungKhoiNhap() {
    if (!rungDangSuaKey) { quayVeTrangHopDong(); return; }
    var r = timRungTrongNhap_(rungDangSuaKey);
    if (!r) { quayVeTrangHopDong(); return; }
    if (!confirm('Xóa lô rừng này khỏi nháp?' + (r.idRung ? ' (sẽ xóa thật khỏi hệ thống khi bấm Lưu chính thức)' : ''))) return;
    if (r.idRung) { r.xoa = true; } // đánh dấu xóa, xử lý thật khi Lưu chính thức
    else { duNhap.rung = duNhap.rung.filter(function (x) { return x.tempId !== r.tempId; }); } // nháp thuần -> bỏ luôn
    luuNhapNgay();
    quayVeTrangHopDong();
  }

  // ---- GPS: điểm đã lưu chính thức (idRung thật, đọc trực tiếp từ HD_GPS) + điểm đang chờ trong nháp ----
  function renderDsGPS_() {
    var r = timRungTrongNhap_(rungDangSuaKey);
    if (!r) return;
    if (r.idRung) {
      document.getElementById('lblGPSDaLuu').style.display = 'block';
      hakRun_().withSuccessHandler(function (list) {
        var el = document.getElementById('dsGPSDaLuu');
        el.innerHTML = (!list || !list.length) ? '<p class="hint">Chưa có điểm nào.</p>' : list.map(function (p, i) {
          var anh = p.hinhAnh ? ' <a href="' + urlAT_(p.hinhAnh) + '" target="_blank">🖼️ Xem ảnh</a>' : '';
          return '<div class="gps-row"><span>Điểm ' + (i + 1) + '</span><span style="font-family:monospace">' + Number(p.lat).toFixed(6) + ', ' + Number(p.lng).toFixed(6) + anh + '</span></div>';
        }).join('');
      }).withFailureHandler(function () { document.getElementById('dsGPSDaLuu').innerHTML = '<p class="hint">Không tải được.</p>'; }).layGPSCuaRung(r.idRung);
    } else {
      document.getElementById('lblGPSDaLuu').style.display = 'none';
      document.getElementById('dsGPSDaLuu').innerHTML = '';
    }
    var elNhap = document.getElementById('dsGPSNhap');
    var gpsMoi = r.gpsMoi || [];
    elNhap.innerHTML = !gpsMoi.length ? '<p class="hint">Chưa có điểm nào trong nháp.</p>' : gpsMoi.map(function (p, i) {
      var anh = p.anhUrl ? ' <a href="' + urlAT_(p.anhUrl) + '" target="_blank">🖼️</a>' : '';
      return '<div class="gps-row nhap"><span>🟡 Điểm nháp ' + (i + 1) + '</span><span style="font-family:monospace">' + Number(p.lat).toFixed(6) + ', ' + Number(p.lng).toFixed(6) + anh + '</span>' +
        '<button class="btn btn-outline" style="padding:2px 8px;font-size:11px" onclick="xoaDiemGPSNhap(' + i + ')">Xóa</button></div>';
    }).join('');
  }

  function taiAnhLayGPS() {
    var fi = document.getElementById('fileAnhLayGPS');
    if (!fi.files.length) return;
    var file = fi.files[0];
    document.getElementById('tenFileAnhLayGPS').textContent = file.name;
    showMsg('msgGPS', '⌛ Đang đọc EXIF trong ảnh...', true);
    var reader = new FileReader();
    reader.onload = function (e) {
      var base64 = e.target.result.split(',')[1];
      hakRun_()
        .withSuccessHandler(function (kq) {
          if (!kq.thanhCong) { fi.value = ''; showMsg('msgGPS', '❌ ' + kq.loi, false); return; }
          // ⚠️ BỔ SUNG: TRƯỚC ĐÂY ảnh dùng để đọc EXIF bị VỨT BỎ sau khi lấy xong tọa độ —
          // chỉ giữ lại lat/lng, không lưu ảnh vào đâu cả (cột HINH_ANH trong HD_GPS luôn
          // trống). Giờ tải LUÔN chính ảnh này lên Drive và đính kèm vào điểm GPS, vì đây
          // đúng là ảnh minh chứng thực địa cho điểm tọa độ đó.
          showMsg('msgGPS', '⌛ Đọc được tọa độ — đang lưu kèm ảnh minh chứng...', true);
          hakRun_()
            .withSuccessHandler(function (kqAnh) {
              fi.value = '';
              ghiDiemGPSVaoNhap_(kq.lat, kq.lng, kqAnh.thanhCong ? kqAnh.url : '');
              showMsg('msgGPS', kqAnh.thanhCong ? '✅ Đã thêm điểm + ảnh minh chứng vào nháp.' : '⚠️ Đã thêm điểm nhưng không lưu được ảnh: ' + kqAnh.loi, true);
            })
            .withFailureHandler(function (err) {
              fi.value = '';
              ghiDiemGPSVaoNhap_(kq.lat, kq.lng, '');
              showMsg('msgGPS', '⚠️ Đã thêm điểm nhưng lỗi lưu ảnh: ' + err.message, false);
            })
            .TAI_ANH_GPS_LEN_DRIVE(base64, file.type, file.name);
        })
        .withFailureHandler(function (err) { fi.value = ''; showMsg('msgGPS', '❌ Lỗi: ' + err.message, false); })
        .TRICH_XUAT_GPS_TU_ANH(base64, file.type);
    };
    reader.readAsDataURL(file);
  }

  function ghiDiemGPSVaoNhap_(lat, lng, anhUrl) {
    var r = timRungTrongNhap_(rungDangSuaKey);
    if (!r) return;
    if (!r.gpsMoi) r.gpsMoi = [];
    r.gpsMoi.push({ lat: lat, lng: lng, anhUrl: anhUrl || '' });
    setVal('gpsLatTay', ''); setVal('gpsLngTay', '');
    luuNhapNgay();
    renderDsGPS_();
    if (!anhUrl) showMsg('msgGPS', '✅ Đã thêm điểm vào nháp (sẽ ghi thật khi Lưu chính thức).', true);
  }

  function xoaDiemGPSNhap(idx) {
    var r = timRungTrongNhap_(rungDangSuaKey);
    if (!r || !r.gpsMoi) return;
    r.gpsMoi.splice(idx, 1);
    luuNhapNgay();
    renderDsGPS_();
  }

  // ---- Hồ sơ pháp lý / Ảnh hiện trường: CHỈ dùng khi lô rừng đã có idRung THẬT — giữ nguyên luồng cũ, ghi thẳng ngay (không qua nháp) ----
  function taiLenHoSoRung() {
    var r = timRungTrongNhap_(rungDangSuaKey);
    if (!r || !r.idRung) { showMsg('msgHoSoRung', '❌ Lô rừng chưa có ID thật — Lưu chính thức trước.', false); return; }
    var fi = document.getElementById('fileHoSoRung');
    if (!fi.files.length) { showMsg('msgHoSoRung', '❌ Chọn file trước.', false); return; }
    var file = fi.files[0];
    showMsg('msgHoSoRung', '⌛ Đang tải lên...', true);
    var reader = new FileReader();
    reader.onload = function (e) {
      var base64 = e.target.result.split(',')[1];
      hakRun_()
        .withSuccessHandler(function (kq) {
          if (!kq.thanhCong) { showMsg('msgHoSoRung', '❌ ' + kq.loi, false); return; }
          showMsg('msgHoSoRung', '✅ Đã tải lên: ' + kq.tenFile, true);
          fi.value = ''; document.getElementById('tenFileHoSoRung').textContent = '';
          document.getElementById('dsHoSoRung').innerHTML = '<div class="hint">📎 Đã có hồ sơ đính kèm — <a href="' + urlAT_(kq.url) + '" target="_blank">Xem file</a></div>';
        })
        .withFailureHandler(function (err) { showMsg('msgHoSoRung', '❌ Lỗi: ' + err.message, false); })
        .TAI_LEN_HO_SO_RUNG(r.idRung, file.name, base64, file.type);
    };
    reader.readAsDataURL(file);
  }

  // ⚠️ ĐÃ SỬA: TRƯỚC ĐÂY hàm này chỉ xóa trắng khu vực hiển thị, KHÔNG hề gọi gì
  // để lấy hồ sơ đã đính kèm — nên khi mở lại 1 lô rừng đã có sẵn file, khu vực
  // "Hồ sơ pháp lý đính kèm" luôn trống dù dữ liệu đã lưu (thấy đúng trong Báo
  // cáo "Xem chi tiết" nhưng không thấy ở đây). Giờ gọi layHoSoCuaHopDong() đã
  // có sẵn (06_CreateUpdate.gs) để hiện link file thật, bấm mở được trực tiếp.
  function taiDsHoSoRungThat(idRung) {
    var el = document.getElementById('dsHoSoRung');
    el.innerHTML = '<p class="hint">Đang tải...</p>';
    if (!duNhap.idHD) { el.innerHTML = ''; return; }
    hakRun_()
      .withSuccessHandler(function (list) {
        var hs = (list || []).find(function (x) { return (x.idRung || '').toString().trim() === idRung.toString().trim(); });
        if (!hs) { el.innerHTML = '<p class="hint">Không tìm thấy thông tin hồ sơ.</p>'; return; }
        var dongFile = hs.dinhKem
          ? (hs.dinhKem.url
            ? '<a href="' + urlAT_(hs.dinhKem.url) + '" target="_blank">📎 ' + escAT_(hs.dinhKem.ten) + '</a>'
            : (hs.dinhKem.ten || '') + ' <span class="hint">(không tìm thấy file trên Drive)</span>')
          : '<span class="hint">Chưa đính kèm file nào.</span>';
        el.innerHTML = '<div class="anh-row"><span>Đã đính kèm:</span><span>' + dongFile + '</span></div>';
      })
      .withFailureHandler(function (err) { el.innerHTML = '<p class="hint">❌ Lỗi tải hồ sơ đính kèm: ' + escAT_(err.message) + '</p>'; })
      .layHoSoCuaHopDong(duNhap.idHD);
  }

  function taiAnhHienTruong() {
    var r = timRungTrongNhap_(rungDangSuaKey);
    if (!r || !r.idRung) { showMsg('msgAnh', '❌ Lô rừng chưa có ID thật — Lưu chính thức trước.', false); return; }
    var fi = document.getElementById('fileAnhHienTruong');
    if (!fi.files.length) { showMsg('msgAnh', '❌ Chọn ảnh trước.', false); return; }
    var file = fi.files[0];
    showMsg('msgAnh', '⌛ Đang tải lên...', true);
    var reader = new FileReader();
    reader.onload = function (e) {
      var base64 = e.target.result.split(',')[1];
      hakRun_()
        .withSuccessHandler(function (kq) {
          fi.value = ''; document.getElementById('tenFileAnhHienTruong').textContent = '';
          if (!kq.thanhCong) { showMsg('msgAnh', '❌ ' + kq.loi, false); return; }
          showMsg('msgAnh', '✅ Đã tải lên, đang chờ duyệt.' + (kq.gpsDaThem ? ' (đã tự thêm GPS từ ảnh vào hệ thống)' : ''), true);
          taiDsAnh(r.idRung); if (kq.gpsDaThem) renderDsGPS_();
        })
        .withFailureHandler(function (err) { showMsg('msgAnh', '❌ Lỗi: ' + err.message, false); })
        .THEM_ANH_RUNG({ idHD: duNhap.idHD, idRung: r.idRung, tenFileGoc: file.name, base64Data: base64, mimeType: file.type });
    };
    reader.readAsDataURL(file);
  }

  function taiDsAnh(idRung) {
    hakRun_()
      .withSuccessHandler(function (list) {
        var el = document.getElementById('dsAnh');
        if (!list || !list.length) { el.innerHTML = '<p class="hint">Chưa có ảnh riêng nào của lô rừng này.</p>'; return; }
        el.innerHTML = list.map(function (a) {
          var badge = a.trangThai === 'Đã duyệt' ? '<span class="badge-da-duyet">✅ Đã duyệt</span>' : '<span class="badge-cho-duyet">⏳ Chờ duyệt</span>';
          var nut = a.trangThai === 'Đã duyệt' ? '' : '<button class="btn btn-outline" style="padding:3px 8px;font-size:11px" onclick="duyetAnh(' + escAT_(a.soDong) + ')">✅ Duyệt</button> ' +
            '<button class="btn" style="padding:3px 8px;font-size:11px;background:#dc2626;color:#fff" onclick="tuChoiAnh(' + escAT_(a.soDong) + ')">✖ Từ chối</button>';
          return '<div class="anh-row"><span>' + escAT_(a.tenFile || '') + ' ' + badge + '</span><span><a href="' + urlAT_(a.url) + '" target="_blank" class="btn btn-outline" style="padding:3px 8px;font-size:11px">Xem</a> ' + nut + '</span></div>';
        }).join('');
      })
      .withFailureHandler(function () { document.getElementById('dsAnh').innerHTML = '<p class="hint">Không tải được danh sách ảnh.</p>'; })
      .layDraftAnhChoRung(idRung);

    // ⚠️ BỔ SUNG: layDraftAnhChoRung() ở trên CHỈ trả ảnh đi qua đúng luồng
    // "Tải ảnh hiện trường -> Duyệt" VÀ đã gán rõ ID_RUNG. Ảnh thêm bằng cách
    // khác (dán link ảnh có sẵn, import sẵn từ trước) ghi thẳng vào HD_Picture
    // theo ID_HD (không phân biệt lô rừng) nên KHÔNG có mặt ở danh sách trên —
    // trước đây khiến tab "Hình ảnh" báo "Chưa có ảnh nào" dù hợp đồng đã có
    // ảnh từ trước. Tải thêm khối "Ảnh chung của hợp đồng" (dùng layAnhCuaHopDong
    // đã có sẵn, 06_CreateUpdate.gs) để không bị mất hiển thị các ảnh này.
    var elChung = document.getElementById('dsAnhChungHopDong');
    if (duNhap.idHD) {
      hakRun_()
        .withSuccessHandler(function (list) {
          if (!list || !list.length) { elChung.innerHTML = '<p class="hint">Chưa có ảnh chung nào.</p>'; return; }
          elChung.innerHTML = list.map(function (a) {
            return '<div class="anh-row"><span>' + escAT_(a.ten || '') + '</span><span>' + (a.url ? '<a href="' + urlAT_(a.url) + '" target="_blank" class="btn btn-outline" style="padding:3px 8px;font-size:11px">Xem</a>' : '<span class="hint">(không tìm thấy file trên Drive)</span>') + '</span></div>';
          }).join('');
        })
        .withFailureHandler(function () { elChung.innerHTML = '<p class="hint">Không tải được.</p>'; })
        .layAnhCuaHopDong(duNhap.idHD);
    } else {
      elChung.innerHTML = '';
    }
  }

  function duyetAnh(soDong) { var r = timRungTrongNhap_(rungDangSuaKey); hakRun_().withSuccessHandler(function () { taiDsAnh(r.idRung); }).withFailureHandler(function (err) { thongBao_('❌ ' + err.message); }).DUYET_ANH_RUNG(soDong); }

  function tuChoiAnh(soDong) { if (!confirm('Từ chối (xóa) ảnh này?')) return; var r = timRungTrongNhap_(rungDangSuaKey); hakRun_().withSuccessHandler(function () { taiDsAnh(r.idRung); }).withFailureHandler(function (err) { thongBao_('❌ ' + err.message); }).TU_CHOI_ANH_RUNG(soDong); }

  function chonTabRung(tab) {
    tabRungHienTai = tab;
    document.getElementById('tabNoiDungGPS').style.display = (tab === 'gps') ? 'block' : 'none';
    document.getElementById('tabNoiDungAnh').style.display = (tab === 'anh') ? 'block' : 'none';
    document.getElementById('tabBtnGPS').classList.toggle('active', tab === 'gps');
    document.getElementById('tabBtnAnh').classList.toggle('active', tab === 'anh');
  }

  // ============ TAB: TÀI KHOẢN — thao tác trên duNhap.taiKhoan[] ============
  function renderTomTatTK() {
    var el = document.getElementById('dsTKTomTat');
    var ds = (duNhap.taiKhoan || []).filter(function (t) { return !t.xoa; });
    if (!ds.length) { el.innerHTML = '<p class="hint">Chưa có tài khoản nào.</p>'; return; }
    el.innerHTML = ds.map(function (t) {
      var key = t.soDong || t.tempId; var laNhap = !t.soDong;
      return '<div class="row-card' + (laNhap ? ' la-nhap' : '') + '" style="cursor:default">' +
        '<div><b>' + escAT_(t.soTK || '') + '</b>' + (laNhap ? '<span class="tag-nhap">NHÁP</span>' : '') + ' — ' + escAT_(t.nganHang || '') + '<br>' +
        '<span class="hint">Ủy quyền TT: ' + escAT_(t.uyQuyenTT || 'Không') + (t.tenUyQuyen ? ' (' + escAT_(t.tenUyQuyen) + ')' : '') + '</span></div>' +
        '<div><button class="btn btn-outline" style="padding:5px 12px;font-size:12px" onclick="moFormTK(\'' + key + '\')">✏️ Sửa</button> ' +
        '<button class="btn" style="padding:5px 12px;font-size:12px;background:#dc2626;color:#fff" onclick="xoaTaiKhoanKhoiNhap(\'' + key + '\')">🗑️ Xóa</button></div></div>';
    }).join('');
  }

  function timTKTrongNhap_(key) { return (duNhap.taiKhoan || []).find(function (t) { return t.soDong === key || t.soDong === Number(key) || t.tempId === key; }); }

  function xoaTaiKhoanKhoiNhap(key) {
    var t = timTKTrongNhap_(key); if (!t) return;
    if (!confirm('Xóa tài khoản này khỏi nháp?')) return;
    if (t.soDong) t.xoa = true; else duNhap.taiKhoan = duNhap.taiKhoan.filter(function (x) { return x.tempId !== t.tempId; });
    luuNhapNgay(); renderTomTatTK(); capNhatDemHD();
  }

  function moFormTK(key) {
    tkDangSuaKey = key || null;
    document.getElementById('panelFormTK').style.display = 'block';
    setVal('tSoTK', ''); setVal('tNganHang', ''); document.getElementById('tUyQuyenTT').value = 'Không'; setVal('tTenUyQuyen', ''); toggleUyQuyenTK();
    if (key) {
      var t = timTKTrongNhap_(key);
      document.getElementById('tieuDeFormTK').textContent = '✏️ Sửa tài khoản';
      if (t) { setVal('tSoTK', t.soTK); setVal('tNganHang', t.nganHang); document.getElementById('tUyQuyenTT').value = t.uyQuyenTT || 'Không'; toggleUyQuyenTK(); setVal('tTenUyQuyen', t.tenUyQuyen); }
    } else document.getElementById('tieuDeFormTK').textContent = '➕ Thêm tài khoản mới (nháp)';
    document.getElementById('panelFormTK').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function dongFormTK() { document.getElementById('panelFormTK').style.display = 'none'; tkDangSuaKey = null; }

  function luuTaiKhoanNhap() {
    var d = { soTK: val('tSoTK'), nganHang: val('tNganHang'), uyQuyenTT: val('tUyQuyenTT'), tenUyQuyen: val('tTenUyQuyen'), xoa: false };
    if (!duNhap.taiKhoan) duNhap.taiKhoan = [];
    var existing = tkDangSuaKey ? timTKTrongNhap_(tkDangSuaKey) : null;
    if (existing) Object.assign(existing, d);
    else { d.soDong = null; d.tempId = taoTempId_(); duNhap.taiKhoan.push(d); }
    luuNhapNgay(); renderTomTatTK(); capNhatDemHD(); dongFormTK();
  }

  // ============ TAB: PHỤ LỤC — thao tác trên duNhap.phuLuc[] ============
  function tuTinhThanhTienPL() { var dg = Number(val('plDonGia')) || 0, kl = Number(val('plKhoiLuong')) || 0; setVal('plThanhTien', (dg * kl).toLocaleString('vi-VN') + ' đ'); }

  function renderTomTatPhuLuc() {
    var el = document.getElementById('dsPhuLucTomTat');
    var ds = (duNhap.phuLuc || []).filter(function (p) { return !p.xoa; });
    if (!ds.length) { el.innerHTML = '<p class="hint">Chưa có phụ lục nào.</p>'; return; }
    el.innerHTML = ds.map(function (p, idx) {
      var key = p.soDong || p.tempId; var laNhap = !p.soDong;
      var thanhTien = (Number(p.donGia) || 0) * (Number(p.khoiLuong) || 0);
      return '<div class="row-card' + (laNhap ? ' la-nhap' : '') + '" style="cursor:default">' +
        '<div><b>Phụ lục ' + (idx + 1) + '</b>' + (laNhap ? '<span class="tag-nhap">NHÁP</span>' : '') + ' — Đơn giá ' + formatSoNhap_(p.donGia) + ' đ · KL ' + formatSoNhap_(p.khoiLuong) + ' tấn · Thành tiền ' + formatSoNhap_(thanhTien) + ' đ' +
        (p.ghiChu ? '<br><span class="hint">' + escAT_(p.ghiChu) + '</span>' : '') + '</div>' +
        '<div><button class="btn btn-outline" style="padding:5px 12px;font-size:12px" onclick="moFormPhuLuc(\'' + key + '\')">✏️ Sửa</button> ' +
        '<button class="btn" style="padding:5px 12px;font-size:12px;background:#dc2626;color:#fff" onclick="xoaPhuLucKhoiNhap(\'' + key + '\')">🗑️ Xóa</button></div></div>';
    }).join('');
  }

  function timPLTrongNhap_(key) { return (duNhap.phuLuc || []).find(function (p) { return p.soDong === key || p.soDong === Number(key) || p.tempId === key; }); }

  function xoaPhuLucKhoiNhap(key) {
    var p = timPLTrongNhap_(key); if (!p) return;
    if (!confirm('Xóa phụ lục này khỏi nháp?')) return;
    if (p.soDong) p.xoa = true; else duNhap.phuLuc = duNhap.phuLuc.filter(function (x) { return x.tempId !== p.tempId; });
    luuNhapNgay(); renderTomTatPhuLuc(); capNhatDemHD();
  }

  function moFormPhuLuc(key) {
    plDangSuaKey = key || null;
    document.getElementById('panelFormPL').style.display = 'block';
    setVal('plDonGia', ''); setVal('plKhoiLuong', ''); setVal('plThanhTien', ''); setVal('plGhiChu', '');
    if (key) {
      var p = timPLTrongNhap_(key);
      document.getElementById('tieuDeFormPL').textContent = '✏️ Sửa phụ lục';
      if (p) { setVal('plDonGia', p.donGia); setVal('plKhoiLuong', p.khoiLuong); setVal('plGhiChu', p.ghiChu); tuTinhThanhTienPL(); }
    } else document.getElementById('tieuDeFormPL').textContent = '➕ Thêm phụ lục mới (nháp)';
    document.getElementById('panelFormPL').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function dongFormPhuLuc() { document.getElementById('panelFormPL').style.display = 'none'; plDangSuaKey = null; }

  function luuPhuLucNhap() {
    var d = { donGia: val('plDonGia'), khoiLuong: val('plKhoiLuong'), ghiChu: val('plGhiChu'), xoa: false };
    if (!duNhap.phuLuc) duNhap.phuLuc = [];
    var existing = plDangSuaKey ? timPLTrongNhap_(plDangSuaKey) : null;
    if (existing) Object.assign(existing, d);
    else { d.soDong = null; d.tempId = taoTempId_(); duNhap.phuLuc.push(d); }
    luuNhapNgay(); renderTomTatPhuLuc(); capNhatDemHD(); dongFormPhuLuc();
  }

  // ---- MODAL Phiếu cân tham khảo (đọc trực tiếp PhieuCan_DN, không liên quan nháp) ----
  function moModalPhieuCan() {
    document.getElementById('modalPhieuCan').style.display = 'flex';
    document.getElementById('modalPhieuCanTen').textContent = 'Chủ rừng: ' + (tenChuRungHienTai || duNhap.hopDong.tenChuRung || '');
    document.getElementById('modalPhieuCanNoiDung').innerHTML = '<p class="hint">⌛ Đang tải...</p>';
    hakRun_()
      .withSuccessHandler(function (kq) {
        if (!kq.thanhCong) { document.getElementById('modalPhieuCanNoiDung').innerHTML = '<p class="msg err">❌ ' + escAT_(kq.loi) + '</p>'; return; }
        if (!kq.danhSach.length) { document.getElementById('modalPhieuCanNoiDung').innerHTML = '<p class="hint">Không tìm thấy phiếu cân nào khớp tên chủ rừng này.</p>'; return; }
        var html = '<table class="data-table"><thead><tr><th>Ngày</th><th>Số phiếu</th><th>Khối lượng (tấn)</th><th>Đơn giá bổ sung</th><th>Thành tiền</th></tr></thead><tbody>';
        kq.danhSach.forEach(function (p) {
          html += '<tr><td>' + (p.ngay ? new Date(p.ngay).toLocaleDateString('vi-VN') : '') + '</td><td>' + escAT_(p.soPhieu || '') + '</td>' +
            '<td>' + formatSoNhap_(p.khoiLuong) + '</td><td>' + formatSoNhap_(p.donGia) + '</td><td>' + formatSoNhap_(p.thanhTien) + '</td></tr>';
        });
        html += '</tbody></table>';
        document.getElementById('modalPhieuCanNoiDung').innerHTML = html;
      })
      .withFailureHandler(function (err) { document.getElementById('modalPhieuCanNoiDung').innerHTML = '<p class="msg err">❌ Lỗi: ' + escAT_(err.message) + '</p>'; })
      .layPhieuCanTheoChuRung(tenChuRungHienTai || duNhap.hopDong.tenChuRung);
  }

  function dongModalPhieuCan() { document.getElementById('modalPhieuCan').style.display = 'none'; }

  // ============ VÙNG NGUY HIỂM — áp dụng ngay lên bảng gốc, không qua nháp ============
  function huyHopDongForm() {
    if (!duNhap.idHD) { thongBao_('Hợp đồng chưa được Lưu chính thức lần nào, chưa thể hủy.'); return; }
    if (!confirm('Hủy hợp đồng này? (dữ liệu vẫn giữ nguyên, chỉ đổi trạng thái)')) return;
    hakRun_()
      .withSuccessHandler(function (kq) { if (kq.thanhCong) { document.getElementById('tinhTrang').value = 'Đã hủy'; debounceLuuNhap(); showMsg('msgNguyHiem', '✅ Đã hủy hợp đồng.', true); } else showMsg('msgNguyHiem', '❌ ' + kq.loi, false); })
      .withFailureHandler(function (err) { showMsg('msgNguyHiem', '❌ Lỗi: ' + err.message, false); })
      .HUY_HOP_DONG(duNhap.idHD);
  }

  function xoaVinhVienForm() {
    if (!duNhap.idHD) { thongBao_('Hợp đồng chưa được Lưu chính thức lần nào, chưa thể xóa.'); return; }
    if (!document.getElementById('xacNhanXoaForm').checked) { showMsg('msgNguyHiem', '❌ Vui lòng tích xác nhận trước khi xóa vĩnh viễn.', false); return; }
    if (!confirm('XÓA VĨNH VIỄN hợp đồng ' + soHDHienTai + '? Không thể hoàn tác!')) return;
    hakRun_()
      .withSuccessHandler(function (kq) { if (kq.thanhCong) { thongBao_('✅ Đã xóa vĩnh viễn.'); veTrangDanhSach(); } else showMsg('msgNguyHiem', '❌ ' + kq.loi, false); })
      .withFailureHandler(function (err) { showMsg('msgNguyHiem', '❌ Lỗi: ' + err.message, false); })
      .XOA_VINH_VIEN_HOP_DONG(duNhap.idHD, true);
  }
</script>
